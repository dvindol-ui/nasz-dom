    // ============================================================================
    // MODAL: DODAWANIE PRZEPISU (WŁASNY + OPCJONALNY IMPORT AI)
    // ============================================================================
    function RecipeImportModal({ geminiApiKey, fridgeItems, onSave, onOpenSettings, onClose }) {
      const [mode, setMode] = useState('manual'); // manual | image | text | ai
      const [loading, setLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      // Formularz własny
      const [title, setTitle] = useState('');
      const [emoji, setEmoji] = useState('🍽️');
      const [prepTime, setPrepTime] = useState('30');
      const [servings, setServings] = useState('2');
      const [tags, setTags] = useState(['klasyki']);
      const [ingredients, setIngredients] = useState([{ name: '', amount: '1', unit: 'szt.' }]);
      const [stepsText, setStepsText] = useState('');

      // AI inputy
      const [imagePreview, setImagePreview] = useState('');
      const [imageBase64, setImageBase64] = useState('');
      const [imageMime, setImageMime] = useState('image/jpeg');
      const [rawText, setRawText] = useState('');
      const [aiPrompt, setAiPrompt] = useState('');

      const handleFile = async (e) => {
        const f = e.target.files?.[0];
        if (!f) return;
        setErrorMsg('');
        try {
          const c = await compressImageFile(f);
          setImagePreview(c.dataUrl);
          setImageBase64(c.base64);
          setImageMime(c.mime);
        } catch (err) {
          setErrorMsg(err.message);
        }
      };

      const handleSaveManual = async (e) => {
        e.preventDefault();
        setErrorMsg('');
        if (!title.trim()) { setErrorMsg('Podaj nazwę dania.'); return; }
        const parsedIngs = ingredients
          .filter((i) => i.name.trim())
          .map((i) => ({
            name: i.name.trim(),
            amount: parseSafeNumber(i.amount, 1) || 1,
            unit: i.unit.trim() || 'szt.',
            category: guessShoppingCategory(i.name),
            isPantry: /(sól|pieprz|olej|oliw|przypraw|cukier|woda)/i.test(i.name)
          }));
        if (parsedIngs.length === 0) { setErrorMsg('Dodaj przynajmniej jeden składnik.'); return; }
        const steps = stepsText.split('\n').map((s) => s.trim()).filter(Boolean);
        await onSave({
          title: title.trim(),
          emoji: emoji || '🍽️',
          prepTime: Math.max(1, parseInt(prepTime, 10) || 25),
          servings: Math.max(1, parseInt(servings, 10) || 2),
          tags: tags.length > 0 ? tags : ['klasyki'],
          source: 'Własny przepis',
          ingredients: parsedIngs,
          steps: steps.length > 0 ? steps : ['Przygotuj składniki i ugotuj danie.']
        });
      };

      const runAI = async () => {
        setErrorMsg('');
        if (!geminiApiKey) {
          setErrorMsg('Aby korzystać z AI, wklej darmowy klucz Google AI Studio w Ustawieniach.');
          return;
        }
        if (mode === 'image' && !imageBase64) { setErrorMsg('Wybierz zrzut ekranu z galerii.'); return; }
        if (mode === 'text' && !rawText.trim()) { setErrorMsg('Wklej tekst przepisu.'); return; }

        setLoading(true);
        try {
          const sys = 'Jesteś polskim asystentem kulinarnym. Zwróć WYŁĄCZNIE poprawny JSON bez markdownu o polach: title (string), emoji (string), prepTime (number), servings (number), tags (array z listy: szybkie, makarony, miesne, vege, jednogarnkowe, klasyki), note (string), ingredients (array obiektów {name, amount (number), unit, isPantry (boolean)}), steps (array stringów po polsku).';
          const parts = [];
          if (mode === 'image') {
            parts.push({ text: 'Odczytaj kompletny przepis ze zdjęcia po polsku i zwróć czysty JSON.' });
            parts.push({ inlineData: { mimeType: imageMime, data: imageBase64 } });
          } else if (mode === 'text') {
            parts.push({ text: `Zamień poniższy opis w uporządkowany przepis JSON:\n\n${rawText.trim()}` });
          } else {
            const fridgeList = fridgeItems.map((f) => f.name).join(', ');
            parts.push({
              text: `Wymyśl pyszny domowy obiad dla 2 osób po polsku. ${
                aiPrompt.trim() ? `Wykorzystaj: ${aiPrompt.trim()}.` : fridgeList ? `Mamy w lodówce: ${fridgeList}.` : 'Zaproponuj coś ciekawego.'
              } Zwróć czysty JSON.`
            });
          }

          const res = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(geminiApiKey)}`,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                systemInstruction: { parts: [{ text: sys }] },
                contents: [{ role: 'user', parts }],
                generationConfig: { responseMimeType: 'application/json' }
              })
            }
          );
          if (!res.ok) throw new Error('Błąd API Gemini — sprawdź klucz w Ustawieniach.');
          const data = await res.json();
          const txt = data?.candidates?.[0]?.content?.parts?.map((p) => p.text || '').join('') || '';
          const first = txt.indexOf('{');
          const last = txt.lastIndexOf('}');
          const parsed = JSON.parse(txt.slice(first, last + 1));

          // Przerzuć wynik AI do formularza ręcznego do podglądu i zapisu
          setTitle(parsed.title || 'Nowy przepis');
          setEmoji(parsed.emoji || '🍽️');
          setPrepTime(String(parsed.prepTime || 25));
          setServings(String(parsed.servings || 2));
          setTags(Array.isArray(parsed.tags) && parsed.tags.length ? parsed.tags : ['klasyki']);
          setIngredients(
            (parsed.ingredients || []).map((i) => ({
              name: i.name || '',
              amount: String(i.amount || 1),
              unit: i.unit || 'szt.'
            }))
          );
          setStepsText((parsed.steps || []).join('\n'));
          setMode('manual');
        } catch (err) {
          setErrorMsg(err.message || 'Nie udało się wygenerować przepisu.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="fixed inset-0 z-[60] bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div className="bg-white w-full max-w-lg max-h-[92vh] rounded-t-3xl sm:rounded-3xl overflow-hidden flex flex-col shadow-2xl">
            <div className="p-4 border-b border-slate-100 flex items-center justify-between">
              <h3 className="font-bold text-base text-slate-900">Dodaj przepis</h3>
              <button onClick={onClose} className="p-2 bg-slate-100 rounded-xl text-slate-500">
                <Icon name="x" className="w-4 h-4" />
              </button>
            </div>

            <div className="px-4 pt-3 flex gap-1.5 overflow-x-auto no-scrollbar">
              {[
                { id: 'manual', label: '✏️ Własne' },
                { id: 'image', label: '📸 Ze zdjęcia' },
                { id: 'text', label: '📝 Z tekstu' },
                { id: 'ai', label: '✨ Pomysł AI' }
              ].map((m) => (
                <button
                  key={m.id}
                  onClick={() => { setMode(m.id); setErrorMsg(''); }}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${
                    mode === m.id ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'
                  }`}
                >
                  {m.label}
                </button>
              ))}
            </div>

            <div className="p-4 overflow-y-auto flex-1 space-y-3">
              {errorMsg && (
                <div className="p-3 bg-rose-50 border border-rose-200 rounded-2xl text-xs text-rose-700 flex items-center justify-between gap-2">
                  <span>{errorMsg}</span>
                  {!geminiApiKey && mode !== 'manual' && (
                    <button onClick={onOpenSettings} className="px-2 py-1 bg-rose-600 text-white rounded-lg font-bold shrink-0">
                      Ustawienia
                    </button>
                  )}
                </div>
              )}

              {mode === 'manual' ? (
                <form id="manual-recipe-form" onSubmit={handleSaveManual} className="space-y-3">
                  <div className="flex gap-2">
                    <input
                      type="text"
                      value={emoji}
                      onChange={(e) => setEmoji(e.target.value)}
                      className="w-14 bg-slate-50 border border-slate-200 rounded-2xl text-center py-2"
                    />
                    <input
                      type="text"
                      value={title}
                      onChange={(e) => setTitle(e.target.value)}
                      placeholder="Nazwa dania (np. Makaron z pesto)"
                      className="flex-1 bg-slate-50 border border-slate-200 rounded-2xl px-3.5 py-2"
                      required
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <input
                      type="number"
                      value={prepTime}
                      onChange={(e) => setPrepTime(e.target.value)}
                      placeholder="Czas (min)"
                      className="bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2"
                    />
                    <input
                      type="number"
                      value={servings}
                      onChange={(e) => setServings(e.target.value)}
                      placeholder="Porcje"
                      className="bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2"
                    />
                  </div>

                  <div className="space-y-2">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-bold text-slate-600">Składniki</span>
                      <button
                        type="button"
                        onClick={() => setIngredients((prev) => [...prev, { name: '', amount: '1', unit: 'szt.' }])}
                        className="text-xs font-bold text-indigo-600"
                      >
                        + Dodaj składnik
                      </button>
                    </div>
                    {ingredients.map((row, idx) => (
                      <div key={idx} className="flex gap-1.5">
                        <input
                          type="text"
                          value={row.name}
                          onChange={(e) =>
                            setIngredients((p) => p.map((r, i) => (i === idx ? { ...r, name: e.target.value } : r)))
                          }
                          placeholder="Składnik"
                          className="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5"
                        />
                        <input
                          type="text"
                          value={row.amount}
                          onChange={(e) =>
                            setIngredients((p) => p.map((r, i) => (i === idx ? { ...r, amount: e.target.value } : r)))
                          }
                          className="w-14 bg-slate-50 border border-slate-200 rounded-xl px-2 py-1.5 text-center"
                        />
                        <input
                          type="text"
                          value={row.unit}
                          onChange={(e) =>
                            setIngredients((p) => p.map((r, i) => (i === idx ? { ...r, unit: e.target.value } : r)))
                          }
                          className="w-16 bg-slate-50 border border-slate-200 rounded-xl px-2 py-1.5 text-center"
                        />
                      </div>
                    ))}
                  </div>

                  <div>
                    <label className="text-xs font-bold text-slate-600">Kroki (każdy w nowej linii)</label>
                    <textarea
                      rows="4"
                      value={stepsText}
                      onChange={(e) => setStepsText(e.target.value)}
                      placeholder="1. Ugotuj makaron...&#10;2. Wymieszaj z sosem..."
                      className="mt-1 w-full bg-slate-50 border border-slate-200 rounded-2xl p-3"
                    />
                  </div>
                </form>
              ) : mode === 'image' ? (
                <div className="space-y-3">
                  <p className="text-xs text-slate-500">
                    Zrób zrzut ekranu przepisu z Instagrama / TikToka i wgraj z galerii iPhone’a — AI wyciągnie składniki i kroki.
                  </p>
                  <label className="block w-full py-6 border-2 border-dashed border-slate-300 rounded-2xl text-center text-xs font-bold text-indigo-600 cursor-pointer">
                    📸 Wybierz zdjęcie z iPhone’a
                    <input type="file" accept="image/*" onChange={handleFile} className="hidden" />
                  </label>
                  {imagePreview && <img src={imagePreview} alt="Podgląd" className="w-full max-h-48 object-contain rounded-2xl" />}
                </div>
              ) : mode === 'text' ? (
                <textarea
                  rows="6"
                  value={rawText}
                  onChange={(e) => setRawText(e.target.value)}
                  placeholder="Wklej skopiowany opis spod rolki na Instagramie lub TikToku..."
                  className="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3"
                />
              ) : (
                <div className="space-y-2">
                  <p className="text-xs text-slate-500">
                    Wpisz na co macie ochotę (lub zostaw puste — AI wykorzysta produkty z Waszej Lodówki ❄️).
                  </p>
                  <input
                    type="text"
                    value={aiPrompt}
                    onChange={(e) => setAiPrompt(e.target.value)}
                    placeholder="np. coś szybkiego z kurczakiem i ryżem"
                    className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3.5 py-2.5"
                  />
                </div>
              )}
            </div>

            <div className="p-4 border-t border-slate-100 safe-bottom">
              {mode === 'manual' ? (
                <button
                  type="submit"
                  form="manual-recipe-form"
                  className="w-full py-3 bg-indigo-600 text-white rounded-2xl text-sm font-bold shadow-sm"
                >
                  Zapisz przepis
                </button>
              ) : (
                <button
                  type="button"
                  disabled={loading}
                  onClick={runAI}
                  className="w-full py-3 bg-indigo-600 disabled:opacity-50 text-white rounded-2xl text-sm font-bold flex items-center justify-center gap-2"
                >
                  {loading ? 'Analizuję przepis...' : '✨ Wyciągnij przepis przez AI'}
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // MODAL: WYBÓR PRZEPISU DLA DNIA W PLANERZE
    // ============================================================================
    function MealPlannerPickerModal({ dayId, recipes, onSelect, onClose }) {
      const [query, setQuery] = useState('');
      const [tagFilter, setTagFilter] = useState('all');
      const [servings, setServings] = useState(2);
      const dayObj = WEEK_DAYS.find((d) => d.id === dayId);

      const filtered = useMemo(() => {
        const q = query.trim().toLowerCase();
        return recipes
          .filter((r) => {
            if (tagFilter === 'matches') {
              if (!(r.votes?.user1 === 'yes' && r.votes?.user2 === 'yes')) return false;
            } else if (tagFilter !== 'all') {
              if (!(r.tags || []).includes(tagFilter)) return false;
            }
            if (!q) return true;
            return (
              (r.title || '').toLowerCase().includes(q) ||
              (r.ingredients || []).some((ing) => (ing.name || '').toLowerCase().includes(q))
            );
          })
          .sort((a, b) => {
            const aMatch = a.votes?.user1 === 'yes' && a.votes?.user2 === 'yes' ? 1 : 0;
            const bMatch = b.votes?.user1 === 'yes' && b.votes?.user2 === 'yes' ? 1 : 0;
            return bMatch - aMatch;
          });
      }, [recipes, query, tagFilter]);

      return (
        <div className="fixed inset-0 z-[60] bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div className="bg-white w-full max-w-lg max-h-[90vh] rounded-t-3xl sm:rounded-3xl overflow-hidden flex flex-col shadow-2xl">
            <div className="p-4 border-b border-slate-100 flex items-center justify-between gap-2">
              <div>
                <h3 className="font-bold text-base text-slate-900">Obiad na: {dayObj?.label || dayId}</h3>
                <p className="text-[11px] text-slate-500">Wybierz danie z bazy albo wylosuj pomysł.</p>
              </div>
              <button onClick={onClose} className="p-2 bg-slate-100 rounded-xl text-slate-500">
                <Icon name="x" className="w-4 h-4" />
              </button>
            </div>

            <div className="p-4 border-b border-slate-100 space-y-2.5">
              <div className="flex items-center justify-between bg-slate-50 border border-slate-200/80 rounded-2xl px-3 py-2">
                <span className="text-xs font-bold text-slate-700">Ile porcji gotujemy?</span>
                <div className="flex items-center gap-1.5">
                  {[2, 4].map((preset) => (
                    <button
                      key={preset}
                      type="button"
                      onClick={() => setServings(preset)}
                      className={`px-2.5 py-1 rounded-xl text-xs font-bold ${
                        servings === preset ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200 text-slate-600'
                      }`}
                    >
                      {preset === 2 ? '2 (na dziś)' : '4 (na 2 dni)'}
                    </button>
                  ))}
                </div>
              </div>

              <div className="flex gap-2">
                <div className="relative flex-1">
                  <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                    <Icon name="search" className="w-4 h-4" />
                  </span>
                  <input
                    type="text"
                    value={query}
                    onChange={(e) => setQuery(e.target.value)}
                    placeholder="Szukaj przepisu..."
                    className="w-full bg-slate-50 border border-slate-200 rounded-2xl pl-9 pr-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  />
                </div>
                <button
                  type="button"
                  onClick={() => {
                    if (filtered.length === 0) return;
                    onSelect(filtered[Math.floor(Math.random() * filtered.length)], servings);
                  }}
                  className="px-3 py-2 bg-amber-50 text-amber-800 border border-amber-200 rounded-2xl text-xs font-bold shrink-0"
                >
                  🎲 Losuj
                </button>
              </div>

              <div className="flex gap-1.5 overflow-x-auto pb-0.5 no-scrollbar">
                <button
                  type="button"
                  onClick={() => setTagFilter('all')}
                  className={`px-2.5 py-1 rounded-full text-[11px] font-bold whitespace-nowrap ${
                    tagFilter === 'all' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'
                  }`}
                >
                  Wszystkie
                </button>
                <button
                  type="button"
                  onClick={() => setTagFilter(tagFilter === 'matches' ? 'all' : 'matches')}
                  className={`px-2.5 py-1 rounded-full text-[11px] font-bold whitespace-nowrap ${
                    tagFilter === 'matches' ? 'bg-rose-500 text-white' : 'bg-rose-50 text-rose-600'
                  }`}
                >
                  🔥 Nasze Matche
                </button>
                {RECIPE_TAGS.map((t) => (
                  <button
                    key={t.id}
                    type="button"
                    onClick={() => setTagFilter(tagFilter === t.id ? 'all' : t.id)}
                    className={`px-2.5 py-1 rounded-full text-[11px] font-bold whitespace-nowrap ${
                      tagFilter === t.id ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'
                    }`}
                  >
                    {t.emoji} {t.label}
                  </button>
                ))}
              </div>
            </div>

            <div className="p-3 overflow-y-auto space-y-2 flex-1 bg-slate-50/50 safe-bottom">
              {filtered.map((r) => {
                const isMatch = r.votes?.user1 === 'yes' && r.votes?.user2 === 'yes';
                return (
                  <button
                    key={r.id}
                    type="button"
                    onClick={() => onSelect(r, servings)}
                    className="w-full p-3 bg-white border border-slate-200/80 rounded-2xl flex items-center justify-between gap-3 text-left active:scale-[0.99]"
                  >
                    <div className="flex items-center gap-3 min-w-0">
                      <span className="text-2xl shrink-0">{r.emoji || '🍽️'}</span>
                      <div className="min-w-0">
                        <p className="text-xs font-bold text-slate-900 truncate flex items-center gap-1.5">
                          {r.title}
                          {isMatch && (
                            <span className="px-1.5 py-0.5 bg-rose-500 text-white rounded-full text-[9px] shrink-0">
                              MATCH
                            </span>
                          )}
                        </p>
                        <p className="text-[11px] text-slate-500 mt-0.5">
                          ⏱ {r.prepTime || 25} min • {r.servings || 2} porcje
                        </p>
                      </div>
                    </div>
                    <Icon name="plus" className="w-4 h-4 text-indigo-600 shrink-0" />
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // MODAL: WYBÓR DNIA TYGODNIA DLA WYBRANEGO PRZEPISU
    // ============================================================================
    function ScheduleRecipeDayModal({ recipe, mealPlan, todayJsDay, onAssign, onClose }) {
      const [servings, setServings] = useState(Number(recipe.servings) || 2);

      return (
        <div className="fixed inset-0 z-[60] bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div className="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 space-y-4 shadow-2xl safe-bottom">
            <div className="flex items-start justify-between gap-3">
              <div className="flex items-center gap-2.5 min-w-0">
                <span className="text-2xl">{recipe.emoji || '🍽️'}</span>
                <div className="min-w-0">
                  <h3 className="font-bold text-base text-slate-900">Zaplanuj w kalendarzu</h3>
                  <p className="text-xs text-slate-500 truncate">{recipe.title}</p>
                </div>
              </div>
              <button onClick={onClose} className="p-2 bg-slate-100 rounded-xl text-slate-500 shrink-0">
                <Icon name="x" className="w-4 h-4" />
              </button>
            </div>

            <div className="flex items-center justify-between bg-slate-50 border border-slate-200 rounded-2xl p-3">
              <span className="text-xs font-bold text-slate-700">Liczba porcji:</span>
              <div className="flex items-center gap-2">
                <button
                  type="button"
                  onClick={() => setServings((s) => Math.max(1, s - 1))}
                  className="w-7 h-7 rounded-xl bg-white border border-slate-200 flex items-center justify-center"
                >
                  <Icon name="minus" className="w-3.5 h-3.5" />
                </button>
                <span className="text-sm font-extrabold text-indigo-700 min-w-[3.5rem] text-center">
                  {servings} por.
                </span>
                <button
                  type="button"
                  onClick={() => setServings((s) => Math.min(12, s + 1))}
                  className="w-7 h-7 rounded-xl bg-white border border-slate-200 flex items-center justify-center"
                >
                  <Icon name="plus" className="w-3.5 h-3.5" />
                </button>
              </div>
            </div>

            <div className="space-y-1.5 max-h-72 overflow-y-auto">
              {WEEK_DAYS.map((day) => {
                const existing = mealPlan[day.id];
                const isToday = day.jsDay === todayJsDay;
                return (
                  <button
                    key={day.id}
                    type="button"
                    onClick={() => onAssign(day.id, servings)}
                    className="w-full p-3 bg-slate-50 hover:bg-indigo-50 border border-slate-200/80 rounded-2xl flex items-center justify-between gap-2 text-left active:scale-[0.99]"
                  >
                    <div className="min-w-0">
                      <span className="text-xs font-bold text-slate-900">
                        {day.label} {isToday && <span className="text-indigo-600">(Dziś)</span>}
                      </span>
                      {existing ? (
                        <p className="text-[11px] text-amber-700 truncate mt-0.5">
                          Zastąpi: {existing.emoji} {existing.title}
                        </p>
                      ) : (
                        <p className="text-[11px] text-slate-400 mt-0.5">Wolny dzień</p>
                      )}
                    </div>
                    <Icon name="calendarPlus" className="w-4 h-4 text-indigo-600 shrink-0" />
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // MODAL: USTAWIENIA + KREATOR SYNCHRONIZACJI 2 iPHONE'ÓW (BEZ KOMPUTERA!)
    // ============================================================================
    function SettingsModal({
      household,
      houseCode,
      activeProfile,
      fbConfig,
      syncStatus,
      geminiApiKey,
      onUpdateHousehold,
      onChangeHouseCode,
      onChangeProfile,
      onChangeGeminiKey,
      onShowToast,
      onClose
    }) {
      const [u1, setU1] = useState(household.user1Name || 'Kuba');
      const [u2, setU2] = useState(household.user2Name || 'Ania');
      const [reward, setReward] = useState(household.weeklyReward || '');
      const [code, setCode] = useState(houseCode);
      const [fbRaw, setFbRaw] = useState('');
      const [fbErr, setFbErr] = useState('');
      const [aiKey, setAiKey] = useState(geminiApiKey);

      const handleSaveProfile = async (e) => {
        e.preventDefault();
        await onUpdateHousehold({
          user1Name: u1.trim() || 'Kuba',
          user2Name: u2.trim() || 'Ania',
          weeklyReward: reward.trim() || 'Kawa do łóżka ☕'
        });
        if (code.trim() && code.trim() !== houseCode) {
          onChangeHouseCode(code.trim());
        } else {
          onShowToast('Zapisano ustawienia domu ✅');
        }
      };

      const handleConnectFirebase = () => {
        setFbErr('');
        const parsed = parseFirebaseConfigInput(fbRaw);
        if (!parsed) {
          setFbErr('Nie znaleziono apiKey i projectId. Skopiuj cały blok const firebaseConfig = { ... } z Firebase.');
          return;
        }
        localStorage.setItem('naszdom_fb_config', JSON.stringify(parsed));
        const cleanCode = (code || 'nasz-dom-2026').trim().toLowerCase().replace(/[^a-z0-9-_]/g, '') || 'nasz-dom';
        localStorage.setItem('naszdom_house_code', cleanCode);
        const hash = '#setup=' + encodeSetupPayload({
          firebaseConfig: parsed,
          houseCode: cleanCode,
          profile: activeProfile,
          geminiKey: aiKey.trim()
        });
        window.location.hash = hash;
        localStorage.setItem('naszdom_last_hash', hash);
        window.location.reload();
      };

      const handleDisconnectFirebase = () => {
        localStorage.removeItem('naszdom_fb_config');
        localStorage.removeItem('naszdom_last_hash');
        window.history.replaceState(null, '', window.location.pathname);
        window.location.reload();
      };

      const handleSharePartnerLink = async () => {
        if (!fbConfig) return;
        const partnerProfile = activeProfile === 'user1' ? 'user2' : 'user1';
        const partnerName = partnerProfile === 'user1' ? u1 : u2;
        const cleanCode = (code || houseCode).trim().toLowerCase().replace(/[^a-z0-9-_]/g, '') || 'nasz-dom';
        const payload = encodeSetupPayload({
          firebaseConfig: fbConfig,
          houseCode: cleanCode,
          profile: partnerProfile,
          geminiKey: aiKey.trim()
        });
        const baseUrl = window.location.origin + window.location.pathname;
        const inviteUrl = `${baseUrl}#setup=${payload}`;

        if (navigator.share) {
          try {
            await navigator.share({
              title: 'Nasz Dom — zaproszenie',
              text: `Otwórz ten link w Safari na iPhonie, a potem kliknij Udostępnij → Do ekranu początkowego (${partnerName}):`,
              url: inviteUrl
            });
            return;
          } catch (_) {}
        }
        try {
          await navigator.clipboard.writeText(inviteUrl);
          onShowToast(`Skopiowano link dla: ${partnerName}! Wyślij na WhatsApp / iMessage 📲`);
        } catch (_) {
          window.prompt('Skopiuj ten link i wyślij na drugi iPhone:', inviteUrl);
        }
      };

      return (
        <div className="fixed inset-0 z-[70] bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div className="bg-white w-full max-w-lg max-h-[92vh] rounded-t-3xl sm:rounded-3xl overflow-hidden flex flex-col shadow-2xl">
            <div className="p-4 border-b border-slate-100 flex items-center justify-between">
              <h3 className="font-bold text-base text-slate-900">Ustawienia i Synchronizacja</h3>
              <button onClick={onClose} className="p-2 bg-slate-100 rounded-xl text-slate-500">
                <Icon name="x" className="w-4 h-4" />
              </button>
            </div>

            <div className="p-4 overflow-y-auto space-y-5 flex-1 safe-bottom">
              {/* SEKCJA 1: SYNCHRONIZACJA 2 IPHONE'ÓW */}
              <div className="bg-indigo-50/70 border border-indigo-200 rounded-3xl p-4 space-y-3">
                <div className="flex items-center justify-between">
                  <h4 className="text-sm font-extrabold text-indigo-950 flex items-center gap-1.5">
                    <Icon name="cloud" className="w-4 h-4 text-indigo-600" />
                    Synchronizacja 2 iPhone’ów (0 zł)
                  </h4>
                  <span
                    className={`text-[10px] font-extrabold px-2 py-0.5 rounded-full ${
                      syncStatus === 'synced' ? 'bg-emerald-500 text-white' : 'bg-slate-200 text-slate-700'
                    }`}
                  >
                    {syncStatus === 'synced' ? 'POŁĄCZONO' : 'LOKALNIE'}
                  </span>
                </div>

                {fbConfig ? (
                  <div className="space-y-2.5">
                    <p className="text-xs text-indigo-900">
                      Projekt Firebase: <strong>{fbConfig.projectId}</strong>. Wyślij poniższy link na drugi iPhone — skonfiguruje go automatycznie!
                    </p>
                    <button
                      type="button"
                      onClick={handleSharePartnerLink}
                      className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl text-xs font-bold flex items-center justify-center gap-2 shadow-sm active:scale-[0.99]"
                    >
                      <Icon name="share" className="w-4 h-4" />
                      Wyślij magiczny link na 2. iPhone ({activeProfile === 'user1' ? u2 : u1})
                    </button>
                    <button
                      type="button"
                      onClick={handleDisconnectFirebase}
                      className="w-full py-2 text-xs font-bold text-rose-600"
                    >
                      Odłącz Firebase
                    </button>
                  </div>
                ) : (
                  <div className="space-y-2.5">
                    <p className="text-xs text-indigo-900 leading-relaxed">
                      Wklej tutaj kod <code>firebaseConfig</code> skopiowany ze strony Firebase (nie musisz nic formatować ani edytować w kodzie strony):
                    </p>
                    <textarea
                      rows="4"
                      value={fbRaw}
                      onChange={(e) => setFbRaw(e.target.value)}
                      placeholder={'const firebaseConfig = {\n  apiKey: "AIza...",\n  projectId: "..."\n};'}
                      className="w-full bg-white border border-indigo-200 rounded-2xl p-3 font-mono text-xs"
                    />
                    {fbErr && <p className="text-xs text-rose-600 font-semibold">{fbErr}</p>}
                    <button
                      type="button"
                      onClick={handleConnectFirebase}
                      className="w-full py-3 bg-indigo-600 text-white rounded-2xl text-xs font-bold shadow-sm"
                    >
                      Połącz z chmurą Firebase
                    </button>
                  </div>
                )}
              </div>

              {/* SEKCJA 2: WASZ DOM I PROFIL */}
              <form onSubmit={handleSaveProfile} className="space-y-3">
                <h4 className="text-xs font-extrabold uppercase tracking-wider text-slate-400">
                  Wasz dom i profile
                </h4>

                <div className="grid grid-cols-2 gap-2">
                  <button
                    type="button"
                    onClick={() => onChangeProfile('user1')}
                    className={`p-2.5 rounded-2xl border text-xs font-bold ${
                      activeProfile === 'user1' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 border-slate-200'
                    }`}
                  >
                    🙋‍♂️ Ten telefon: {u1}
                  </button>
                  <button
                    type="button"
                    onClick={() => onChangeProfile('user2')}
                    className={`p-2.5 rounded-2xl border text-xs font-bold ${
                      activeProfile === 'user2' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 border-slate-200'
                    }`}
                  >
                    🙋‍♀️ Ten telefon: {u2}
                  </button>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-[11px] font-bold text-slate-500">Osoba 1</label>
                    <input
                      type="text"
                      value={u1}
                      onChange={(e) => setU1(e.target.value)}
                      className="mt-1 w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold text-slate-500">Osoba 2</label>
                    <input
                      type="text"
                      value={u2}
                      onChange={(e) => setU2(e.target.value)}
                      className="mt-1 w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2"
                    />
                  </div>
                </div>

                <div>
                  <label className="text-[11px] font-bold text-slate-500">Wspólny kod domu (tajne hasło pokoju)</label>
                  <input
                    type="text"
                    value={code}
                    onChange={(e) => setCode(e.target.value)}
                    placeholder="np. kuba-ania-7391"
                    className="mt-1 w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2"
                  />
                </div>

                <div>
                  <label className="text-[11px] font-bold text-slate-500">Nagroda tygodnia w obowiązkach</label>
                  <input
                    type="text"
                    value={reward}
                    onChange={(e) => setReward(e.target.value)}
                    className="mt-1 w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2"
                  />
                </div>

                <button
                  type="submit"
                  className="w-full py-2.5 bg-slate-900 text-white rounded-2xl text-xs font-bold"
                >
                  Zapisz ustawienia domu
                </button>
              </form>

              {/* SEKCJA 3: OPCJONALNE AI */}
              <div className="pt-3 border-t border-slate-100 space-y-2">
                <h4 className="text-xs font-extrabold uppercase tracking-wider text-slate-400">
                  Import przepisów AI (opcjonalnie, 0 zł)
                </h4>
                <p className="text-xs text-slate-500">
                  Darmowy klucz z <strong>aistudio.google.com</strong> odblokuje skanowanie zrzutów ekranu z Instagrama i TikToka.
                </p>
                <div className="flex gap-2">
                  <input
                    type="password"
                    value={aiKey}
                    onChange={(e) => setAiKey(e.target.value)}
                    placeholder="AIzaSy..."
                    className="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2"
                  />
                  <button
                    type="button"
                    onClick={() => onChangeGeminiKey(aiKey.trim())}
                    className="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold shrink-0"
                  >
                    Zapisz
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
