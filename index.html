    // ============================================================================
    // FUNKCJE POMOCNICZE
    // ============================================================================
    function guessShoppingCategory(name) {
      const n = (name || '').toLowerCase();
      if (/(pomidor|ogórek|cebula|czosnek|szpinak|sałat|marchew|ziemniak|cukini|papryk|jabłk|banan|cytryn|koperek|bazyl|brokuł|pieczark|awokado|owoc|warzyw)/.test(n)) return 'warzywa';
      if (/(mleko|ser|parmezan|mozzarell|jogurt|śmietan|masło|jajk|twaróg|kefir)/.test(n)) return 'nabial';
      if (/(kurczak|indyk|mięso|schab|wołow|wieprz|szynk|boczek|kiełbas|łosoś|tuńczyk|ryba|krewet)/.test(n)) return 'mieso';
      if (/(chleb|bułk|tortill|bagiet|pieczyw|tost)/.test(n)) return 'pieczywo';
      if (/(makaron|ryż|kasza|mąka|płatki|ciecierzyc|fasol|gnocchi|soczewic)/.test(n)) return 'sypkie';
      if (/(sól|pieprz|oliw|olej|sos|passat|ketchup|musztard|majonez|przypraw|curry|oregano|cukier|mleczko kokos|suszone)/.test(n)) return 'przyprawy';
      if (/(papier|mydło|płyn|kapsułk|proszek|worki|ręcznik|pasta do zębów|szampon)/.test(n)) return 'chemia';
      return 'inne';
    }

    function parseSafeNumber(val, fallback = 1) {
      if (typeof val === 'number' && !Number.isNaN(val)) return val;
      const n = parseFloat(String(val || '').replace(',', '.'));
      return Number.isNaN(n) ? fallback : n;
    }

    function formatAmount(num) {
      const n = Math.round(parseSafeNumber(num, 1) * 10) / 10;
      return Number.isInteger(n) ? String(n) : String(n).replace('.', ',');
    }

    function formatDishCount(n) {
      if (n === 1) return '1 danie';
      if (n >= 2 && n <= 4) return `${n} dania`;
      return `${n} dań`;
    }

    function encodeSetupPayload(obj) {
      const bytes = new TextEncoder().encode(JSON.stringify(obj));
      let bin = '';
      bytes.forEach((b) => { bin += String.fromCharCode(b); });
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function decodeSetupPayload(str) {
      const b64 = str.replace(/-/g, '+').replace(/_/g, '/');
      const bin = atob(b64);
      const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(bytes));
    }

    function parseFirebaseConfigInput(raw) {
      if (!raw || typeof raw !== 'string') return null;
      try {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.apiKey && parsed.projectId) return parsed;
      } catch (_) {}
      const keys = ['apiKey', 'authDomain', 'projectId', 'storageBucket', 'messagingSenderId', 'appId'];
      const out = {};
      for (const k of keys) {
        const m = raw.match(new RegExp(`["']?${k}["']?\\s*:\\s*["']([^"']+)["']`));
        if (m && m[1]) out[k] = m[1].trim();
      }
      return out.apiKey && out.projectId ? out : null;
    }

    function compressImageFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Nie udało się odczytać zdjęcia.'));
        reader.onload = (ev) => {
          const img = new Image();
          img.onerror = () => reject(new Error('Niepoprawny plik graficzny.'));
          img.onload = () => {
            const maxDim = 1200;
            let w = img.width;
            let h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
              else { w = Math.round((w * maxDim) / h); h = maxDim; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
            resolve({ dataUrl, base64: dataUrl.split(',')[1], mime: 'image/jpeg' });
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function isChoreDue(chore) {
      if (!chore.lastDoneAt) return true;
      if (chore.frequency === 'jednorazowe') return false;
      const days = FREQUENCY_DAYS[chore.frequency] || 1;
      const diffHours = (Date.now() - chore.lastDoneAt) / (1000 * 60 * 60);
      return diffHours >= days * 20;
    }

    // ============================================================================
    // INICJALIZACJA KONFIGURACJI (obsługa magicznego linku #setup= i iOS PWA!)
    // ============================================================================
    function bootstrapInitialSettings() {
      try {
        const hash = window.location.hash || '';
        const lastApplied = localStorage.getItem('naszdom_last_hash');
        if (hash.startsWith('#setup=') && hash !== lastApplied) {
          const payload = decodeSetupPayload(hash.slice(7));
          if (payload.firebaseConfig) {
            localStorage.setItem('naszdom_fb_config', JSON.stringify(payload.firebaseConfig));
          }
          if (payload.houseCode) {
            localStorage.setItem('naszdom_house_code', payload.houseCode);
          }
          if (payload.profile === 'user1' || payload.profile === 'user2') {
            localStorage.setItem('naszdom_profile', payload.profile);
          }
          if (payload.geminiKey) {
            localStorage.setItem('naszdom_gemini_key', payload.geminiKey);
          }
          localStorage.setItem('naszdom_last_hash', hash);
        }
      } catch (err) {
        console.warn('Nie udało się odczytać linku startowego:', err);
      }

      let fbConfig = DEFAULT_FIREBASE_CONFIG;
      try {
        const saved = localStorage.getItem('naszdom_fb_config');
        if (saved) fbConfig = JSON.parse(saved);
      } catch (_) {}

      return {
        fbConfig,
        houseCode: localStorage.getItem('naszdom_house_code') || 'nasz-dom-2026',
        profile: localStorage.getItem('naszdom_profile') || 'user1',
        geminiKey: localStorage.getItem('naszdom_gemini_key') || ''
      };
    }

    const INITIAL_BOOT = bootstrapInitialSettings();

      // Zapis preferencji profilu i kodu domu + aktualizacja #setup dla instalacji iOS PWA
      useEffect(() => {

      // ==========================================================================
      // PODŁĄCZENIE FIREBASE + SYNCHRONIZACJA NA ŻYWO (2 iPhone'y)
      // ==========================================================================
      useEffect(() => {
        if (!fbConfig || !window.firebase) {
          setSyncStatus('local');
          return;
        }
        try {
          if (!window.firebase.apps.length) {
            window.firebase.initializeApp(fbConfig);
          }
          dbRef.current = window.firebase.firestore();
          const auth = window.firebase.auth();
          const unsubAuth = auth.onAuthStateChanged((user) => {
            if (user) {
              setAuthUser(user);
            } else {
              auth.signInAnonymously().catch((err) => {
                console.warn('Błąd logowania anonimowego:', err);
                setSyncStatus('error');
                setSyncError('Włącz „Anonymous” w Firebase → Authentication → Sign-in method.');
              });
            }
          });
          return () => unsubAuth();
        } catch (err) {
          console.warn('Błąd inicjalizacji Firebase:', err);
          setSyncStatus('error');
          setSyncError('Niepoprawna konfiguracja Firebase.');
        }
      }, [fbConfig]);

      useEffect(() => {
        if (!dbRef.current || !authUser) return;
        const db = dbRef.current;
        setSyncStatus('connecting');
        const basePath = `artifacts/${APP_ID}/public/data`;

        const houseDocRef = db.doc(`${basePath}/households/${cleanHouseId}`);
        const unsubHouse = houseDocRef.onSnapshot(
          (snap) => {
            if (snap.exists) {
              const data = { ...defaultHousehold, ...snap.data() };
              householdRef.current = data;
              setHousehold(data);
            } else {
              houseDocRef.set({ ...defaultHousehold, createdAt: Date.now() }).catch(() => {});
            }
            setSyncStatus('synced');
            setSyncError('');
          },
          (err) => {
            console.warn('Błąd Firestore (household):', err);
            setSyncStatus('error');
            setSyncError('Brak uprawnień Firestore — sprawdź reguły (Rules) w Firebase.');
          }
        );

        const unsubShopping = db
          .collection(`${basePath}/shopping`)
          .where('houseCode', '==', cleanHouseId)
          .onSnapshot(
            (snap) => {
              const items = snap.docs
                .map((d) => ({ id: d.id, ...d.data() }))
                .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
              setShoppingItems(items);
            },
            (err) => console.warn('Błąd zakupów:', err)
          );

        const unsubFridge = db
          .collection(`${basePath}/fridge`)
          .where('houseCode', '==', cleanHouseId)
          .onSnapshot(
            (snap) => {
              const items = snap.docs
                .map((d) => ({ id: d.id, ...d.data() }))
                .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
              setFridgeItems(items);
            },
            (err) => console.warn('Błąd lodówki:', err)
          );

        const unsubChores = db
          .collection(`${basePath}/chores`)
          .where('houseCode', '==', cleanHouseId)
          .onSnapshot(
            (snap) => {
              if (snap.empty) {
                const batch = db.batch();
                STARTER_CHORES.forEach((c) => {
                  const ref = db.collection(`${basePath}/chores`).doc(`${cleanHouseId}_${c.id}`);
                  batch.set(ref, { ...c, houseCode: cleanHouseId, createdAt: Date.now() }, { merge: true });
                });
                batch.commit().catch(() => {});
              } else {
                const items = snap.docs
                  .map((d) => ({ id: d.id, ...d.data() }))
                  .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                setChores(items);
              }
            },
            (err) => console.warn('Błąd obowiązków:', err)
          );

        const unsubRecipes = db
          .collection(`${basePath}/recipes`)
          .where('houseCode', '==', cleanHouseId)
          .onSnapshot(
            (snap) => {

                .map((d) => ({ id: d.id, ...d.data() }))

        return () => {
          unsubHouse();
          unsubShopping();

      const colPath = (name) => `artifacts/${APP_ID}/public/data/${name}`;

      // POPRAWIONA funkcja aktualizacji domu (mergeFields naprawia usuwanie dni z Planera!)
      const updateHouseholdField = async (patch) => {
        householdRef.current = { ...householdRef.current, ...patch };
        setHousehold((prev) => ({ ...prev, ...patch }));
        if (!dbRef.current || !authUser) return;

          const ref = dbRef.current.doc(`${colPath('households')}/${cleanHouseId}`);

            await dbRef.current.doc(`${colPath('shopping')}/${existing.id}`).update({ amount: nextAmount });

            setShoppingItems((prev) => prev.map((i) => (i.id === existing.id ? { ...i, amount: nextAmount } : i)));

          return;

          name: cleanName,
          amount,
          unit,
          category,
          checked: false,
          addedBy: activeProfile,
          houseCode: cleanHouseId,
          createdAt: Date.now()
        };

          await dbRef.current.collection(colPath('shopping')).add(newItem);

          name: cleanName,
          amount: addAmt,
          unit: cleanUnit,
          category: category || guessShoppingCategory(cleanName),
          houseCode: cleanHouseId,

        }
      };

      const clearCheckedToFridge = async () => {
        const checked = shoppingItems.filter((i) => i.checked);
        if (checked.length === 0) return;
        try {
          for (const item of checked) {
            if (item.category !== 'chemia') {
              await addOrMergeFridgeItem(item);

            if (dbRef.current && authUser) {
              await dbRef.current.doc(`${colPath('shopping')}/${item.id}`).delete();

          }
          if (!dbRef.current || !authUser) {
            setShoppingItems((prev) => prev.filter((i) => !i.checked));

            await updateHouseholdField({ inStoreBy: null, inStoreAt: null });

          showToast(`Wyczyszczono koszyk — ${checked.length} prod. przeniesiono do Lodówki ❄️`);

          console.warn('Błąd czyszczenia koszyka:', err);
          showToast('Nie udało się wyczyścić koszyka', 'error');

      const updateFridgeAmount = async (item, delta) => {
        const nextAmount = Math.round(((Number(item.amount) || 0) + delta) * 10) / 10;
        if (nextAmount <= 0) {
          if (dbRef.current && authUser) {
            await dbRef.current.doc(`${colPath('fridge')}/${item.id}`).delete();
          } else {
            setFridgeItems((prev) => prev.filter((f) => f.id !== item.id));
          }
          return;
        }
        if (dbRef.current && authUser) {
          await dbRef.current.doc(`${colPath('fridge')}/${item.id}`).update({ amount: nextAmount, updatedAt: Date.now() });
        } else {
          setFridgeItems((prev) => prev.map((f) => (f.id === item.id ? { ...f, amount: nextAmount } : f)));
        }
      };

      const handleQuickAddFridge = async (e) => {
        e.preventDefault();
        if (!newFridgeName.trim()) return;
        await addOrMergeFridgeItem({ name: newFridgeName, amount: newFridgeAmount, unit: newFridgeUnit });
        setNewFridgeName('');
        setNewFridgeAmount('1');
        setNewFridgeUnit('szt.');
        showToast('Dodano do Lodówki ❄️');
      };

      const toggleInStore = async () => {
        const amIInStore = household.inStoreBy === activeProfile;
        await updateHouseholdField({
          inStoreBy: amIInStore ? null : activeProfile,
          inStoreAt: amIInStore ? null : Date.now()
        });
        showToast(amIInStore ? 'Zakończono tryb sklepowy' : `Włączono tryb „W sklepie” — ${partnerUserName} widzi powiadomienie! 🏪`);
      };

      // ==========================================================================
      // OPERACJE: OBOWIĄZKI I PUNKTY
      // ==========================================================================
      const handleAddChore = async (choreData) => {
        const entry = {
          ...choreData,
          houseCode: cleanHouseId,
          lastDoneAt: null,
          lastDoneBy: null,
          createdAt: Date.now()
        };
        if (dbRef.current && authUser) {
          await dbRef.current.collection(colPath('chores')).add(entry);
        } else {
          setChores((prev) => [...prev, { id: `ch-${Date.now()}`, ...entry }]);
        }
        setShowAddChoreModal(false);
        showToast('Dodano nowy obowiązek ✅');
      };

      const completeChore = async (chore) => {
        const pts = Number(chore.points) || 10;
        const pointKey = activeProfile === 'user1' ? 'user1Points' : 'user2Points';
        const nextPoints = (Number(householdRef.current[pointKey]) || 0) + pts;

        await updateHouseholdField({ [pointKey]: nextPoints });
        if (dbRef.current && authUser) {
          await dbRef.current.doc(`${colPath('chores')}/${chore.id}`).update({
            lastDoneAt: Date.now(),
            lastDoneBy: activeProfile
          });
        } else {
          setChores((prev) =>
            prev.map((c) => (c.id === chore.id ? { ...c, lastDoneAt: Date.now(), lastDoneBy: activeProfile } : c))
          );
        }
        showToast(`Brawo ${activeUserName}! +${pts} pkt 🏆`);
      };

      const deleteChore = async (chore) => {
        if (dbRef.current && authUser) {
          await dbRef.current.doc(`${colPath('chores')}/${chore.id}`).delete();
        } else {
          setChores((prev) => prev.filter((c) => c.id !== chore.id));
        }
        showToast('Usunięto obowiązek');
      };

      const sendNudge = async (chore) => {
        await updateHouseholdField({
          nudge: {
            from: activeProfile,
            fromName: activeUserName,
            choreTitle: chore.title,
            sentAt: Date.now()
          }
        });
        showToast(`Wysłano delikatne szturchnięcie do: ${partnerUserName} 🔔`);
      };

      const resetWeeklyPoints = async () => {
        await updateHouseholdField({ user1Points: 0, user2Points: 0 });
        setConfirmResetPoints(false);
        showToast('Wyzerowano punkty na nowy tydzień! 🔄');
      };

      // ==========================================================================
      // OPERACJE: PRZEPISY, TINDER NA OBIAD I PLANER TYGODNIA
      // ==========================================================================
      const saveNewRecipe = async (recipeData) => {
        const entry = {
          ...recipeData,
          votes: { [activeProfile]: 'yes' },
          houseCode: cleanHouseId,
          createdAt: Date.now()
        };
        if (dbRef.current && authUser) {
          await dbRef.current.collection(colPath('recipes')).add(entry);
        } else {
          setCustomRecipes((prev) => [{ id: `rec-${Date.now()}`, ...entry }, ...prev]);
        }
        setShowImportModal(false);
        showToast(`Zapisano przepis: ${recipeData.title} 🍽️`);
      };

      const deleteRecipe = async (recipe) => {
        if (String(recipe.id || '').startsWith('starter-')) return;
        if (dbRef.current && authUser) {
          await dbRef.current.doc(`${colPath('recipes')}/${recipe.id}`).delete();
        } else {
          setCustomRecipes((prev) => prev.filter((r) => r.id !== recipe.id));
        }
        setSelectedRecipeId(null);
        showToast('Usunięto przepis');
      };

      const voteRecipe = async (recipe, vote) => {
        const isStarter = String(recipe.id || '').startsWith('starter-');
        const nextVotes = { ...(recipe.votes || {}), [activeProfile]: vote };

        if (isStarter) {
          const nextStarterVotes = {
            ...(householdRef.current.starterVotes || {}),
            [recipe.id]: nextVotes
          };
          await updateHouseholdField({ starterVotes: nextStarterVotes });
        } else if (dbRef.current && authUser) {
          await dbRef.current.doc(`${colPath('recipes')}/${recipe.id}`).update({ votes: nextVotes });
        } else {
          setCustomRecipes((prev) => prev.map((r) => (r.id === recipe.id ? { ...r, votes: nextVotes } : r)));
        }

        if (nextVotes.user1 === 'yes' && nextVotes.user2 === 'yes') {
          showToast(`🔥 MAMY MATCH! Oboje chcecie: ${recipe.title}`);
        }
      };

      const resetAllVotes = async () => {
        await updateHouseholdField({ starterVotes: {} });
        if (dbRef.current && authUser) {
          for (const r of customRecipes) {
            await dbRef.current.doc(`${colPath('recipes')}/${r.id}`).update({ votes: {} }).catch(() => {});
          }
        } else {
          setCustomRecipes((prev) => prev.map((r) => ({ ...r, votes: {} })));
        }
        showToast('Zresetowano głosy – możecie wybierać na nowo!');
      };

      const openRecipeIngredientsModal = (recipe, mult = 1) => {
        const items = (recipe.ingredients || []).map((ing, idx) => {
          const cleanName = (ing.name || '').trim();
          const unit = (ing.unit || 'szt.').trim();
          const scaled = Math.round((parseSafeNumber(ing.amount, 1) * mult) * 10) / 10;
          const ingLower = cleanName.toLowerCase();
          const matchedInFridge = fridgeItems.find((fi) => {
            const fiLower = (fi.name || '').trim().toLowerCase();
            if (fiLower.length < 3 || ingLower.length < 3) return fiLower === ingLower;
            return ingLower.includes(fiLower) || fiLower.includes(ingLower);
          });

          let needed = scaled;
          let covered = false;
          if (matchedInFridge) {
            const sameUnit = (matchedInFridge.unit || '').trim().toLowerCase() === unit.toLowerCase();
            if (sameUnit) {
              const rem = Math.round((scaled - (Number(matchedInFridge.amount) || 0)) * 10) / 10;
              if (rem <= 0) covered = true;
              else needed = rem;
            } else {
              covered = true;
            }
          }

          return {
            ...ing,
            name: cleanName,
            unit,
            idx,
            inFridge: matchedInFridge || null,
            scaledAmount: needed,
            selected: !ing.isPantry && !covered
          };
        });
        setAddToCartModal({ recipeTitle: recipe.title, items });
      };

      const confirmAddIngredientsToCart = async () => {
        if (!addToCartModal) return;
        const toAdd = addToCartModal.items.filter((i) => i.selected);
        if (toAdd.length === 0) {
          setAddToCartModal(null);
          return;
        }
        for (const ing of toAdd) {
          await addShoppingItem({
            name: ing.name,
            amount: ing.scaledAmount,
            unit: ing.unit,
            category: ing.category || guessShoppingCategory(ing.name)
          });
        }
        setAddToCartModal(null);
        showToast(`Dodano ${toAdd.length} składników na listę zakupów! 🛒`);
      };

      // --- PLANER POSIŁKÓW (PON–ND) ---
      const mealPlan = household.mealPlan || {};
      const todayJsDay = new Date().getDay();
      const plannedMealsCount = useMemo(
        () => WEEK_DAYS.filter((d) => mealPlan[d.id]?.recipeId).length,
        [mealPlan]
      );

      const assignRecipeToDay = async (dayId, recipe, servingsCount = null) => {
        const nextPlan = {
          ...(householdRef.current.mealPlan || {}),
          [dayId]: {
            recipeId: recipe.id,
            starterId: recipe.starterId || (String(recipe.id || '').startsWith('starter-') ? recipe.id : null),
            title: recipe.title,
            emoji: recipe.emoji || '🍽️',
            prepTime: recipe.prepTime || 25,
            servings: servingsCount || recipe.servings || 2,
            cooked: false,
            plannedBy: activeProfile,
            plannedAt: Date.now()
          }
        };
        await updateHouseholdField({ mealPlan: nextPlan });
        const dayObj = WEEK_DAYS.find((d) => d.id === dayId);
        showToast(`Zaplanowano na ${dayObj?.label || dayId}: ${recipe.title} 📅`);
      };

      const updateMealPlanDay = async (dayId, patch) => {
        const current = householdRef.current.mealPlan?.[dayId];
        if (!current) return;
        const nextPlan = {
          ...(householdRef.current.mealPlan || {}),
          [dayId]: { ...current, ...patch }
        };
        await updateHouseholdField({ mealPlan: nextPlan });
      };

      const removeMealPlanDay = async (dayId) => {
        const nextPlan = { ...(householdRef.current.mealPlan || {}) };
        delete nextPlan[dayId];
        await updateHouseholdField({ mealPlan: nextPlan });
        showToast('Usunięto danie z planu tygodnia');
      };

      const clearMealPlan = async () => {
        await updateHouseholdField({ mealPlan: {} });
        setConfirmClearPlan(false);
        showToast('Wyczyszczono plan posiłków na ten tydzień 🧹');
      };

      const randomizeMissingMealDays = async () => {
        if (recipes.length === 0) return;
        const currentPlan = { ...(householdRef.current.mealPlan || {}) };
        const usedIds = new Set(Object.values(currentPlan).map((p) => p?.recipeId).filter(Boolean));
        const emptyDays = WEEK_DAYS.filter((d) => !currentPlan[d.id]?.recipeId);

        if (emptyDays.length === 0) {
          showToast('Cały tydzień jest już zaplanowany! 📅', 'info');
          return;
        }

        const matchPool = recipes.filter(
          (r) => r.votes?.user1 === 'yes' && r.votes?.user2 === 'yes' && !usedIds.has(r.id)
        );
        const otherPool = recipes.filter(
          (r) => !usedIds.has(r.id) && !matchPool.some((m) => m.id === r.id)
        );
        const shuffled = [
          ...matchPool.sort(() => Math.random() - 0.5),
          ...otherPool.sort(() => Math.random() - 0.5)
        ];

        let idx = 0;
        for (const day of emptyDays) {
          const pick = shuffled[idx] || recipes[Math.floor(Math.random() * recipes.length)];
          idx++;
          currentPlan[day.id] = {
            recipeId: pick.id,
            starterId: pick.starterId || (String(pick.id || '').startsWith('starter-') ? pick.id : null),
            title: pick.title,
            emoji: pick.emoji || '🍽️',
            prepTime: pick.prepTime || 25,
            servings: pick.servings || 2,
            cooked: false,
            plannedBy: activeProfile,
            plannedAt: Date.now()
          };
        }
        await updateHouseholdField({ mealPlan: currentPlan });
        showToast(`Wylosowano obiady na ${emptyDays.length} wolnych dni! 🎲`);
      };

      const openWeeklyPlanShoppingModal = () => {
        const activeDays = WEEK_DAYS.filter((d) => mealPlan[d.id]?.recipeId && !mealPlan[d.id]?.cooked);
        if (activeDays.length === 0) {
          showToast('Najpierw zaplanuj przynajmniej jeden nieugotowany obiad 📅', 'info');
          return;
        }

        const mergedMap = new Map();
        for (const day of activeDays) {
          const entry = mealPlan[day.id];
          const recipe = recipes.find(
            (r) =>
              r.id === entry.recipeId ||
              (entry.starterId && (r.id === entry.starterId || r.starterId === entry.starterId))
          );
          if (!recipe) continue;

          const baseServings = Number(recipe.servings) || 2;
          const plannedServings = Number(entry.servings) || baseServings;
          const mult = plannedServings / baseServings;

          for (const ing of recipe.ingredients || []) {
            const cleanName = (ing.name || '').trim();
            if (!cleanName) continue;
            const unit = (ing.unit || 'szt.').trim();
            const key = `${cleanName.toLowerCase()}__${unit.toLowerCase()}`;
            const scaled = (parseSafeNumber(ing.amount, 1) || 1) * mult;

            if (mergedMap.has(key)) {
              const existing = mergedMap.get(key);
              existing.scaledAmount = Math.round((existing.scaledAmount + scaled) * 10) / 10;
              if (!existing.days.includes(day.short)) existing.days.push(day.short);
              if (!ing.isPantry) existing.isPantry = false;
            } else {
              mergedMap.set(key, {
                name: cleanName,
                unit,
                category: ing.category || guessShoppingCategory(cleanName),
                isPantry: !!ing.isPantry,
                scaledAmount: Math.round(scaled * 10) / 10,
                days: [day.short]
              });
            }
          }
        }

        const aggregatedItems = Array.from(mergedMap.values()).map((ing, idx) => {
          const ingLower = ing.name.toLowerCase();
          const matchedInFridge = fridgeItems.find((fi) => {
            const fiLower = (fi.name || '').trim().toLowerCase();
            if (fiLower.length < 3 || ingLower.length < 3) return fiLower === ingLower;
            return ingLower.includes(fiLower) || fiLower.includes(ingLower);
          });

          let neededAmount = ing.scaledAmount;
          let coveredByFridge = false;
          if (matchedInFridge) {
            const sameUnit = (matchedInFridge.unit || '').trim().toLowerCase() === ing.unit.toLowerCase();
            if (sameUnit) {
              const rem = Math.round((ing.scaledAmount - (Number(matchedInFridge.amount) || 0)) * 10) / 10;
              if (rem <= 0) coveredByFridge = true;
              else neededAmount = rem;
            } else {
              coveredByFridge = true;
            }
          }

          return {
            ...ing,
            idx,
            inFridge: matchedInFridge || null,
            scaledAmount: neededAmount,
            selected: !ing.isPantry && !coveredByFridge
          };
        });

        setAddToCartModal({
          recipeTitle: `Plan tygodnia (${formatDishCount(activeDays.length)})`,
          items: aggregatedItems
        });
      };

      // ==========================================================================
      // DANE POCHODNE DO RENDEROWANIA
      // ==========================================================================
      const uncheckedShopping = shoppingItems.filter((i) => !i.checked);
      const checkedShopping = shoppingItems.filter((i) => i.checked);

      const groupedShopping = useMemo(() => {
        const groups = {};
        for (const item of uncheckedShopping) {
          const cat = item.category || 'inne';
          if (!groups[cat]) groups[cat] = [];
          groups[cat].push(item);
        }
        return SHOPPING_CATEGORIES.filter((c) => groups[c.id]?.length > 0).map((c) => ({
          ...c,
          items: groups[c.id]
        }));
      }, [uncheckedShopping]);

      const matchCount = useMemo(
        () => recipes.filter((r) => r.votes?.user1 === 'yes' && r.votes?.user2 === 'yes').length,
        [recipes]
      );

      const filteredRecipes = useMemo(() => {
        const q = recipeSearch.trim().toLowerCase();
        return recipes.filter((r) => {
          if (selectedTag === 'matches') {
            if (!(r.votes?.user1 === 'yes' && r.votes?.user2 === 'yes')) return false;
          } else if (selectedTag !== 'all') {
            if (!(r.tags || []).includes(selectedTag)) return false;
          }
          if (!q) return true;
          return (
            (r.title || '').toLowerCase().includes(q) ||
            (r.ingredients || []).some((i) => (i.name || '').toLowerCase().includes(q))
          );
        });
      }, [recipes, recipeSearch, selectedTag]);

      const visibleChores = useMemo(
        () => (choresFilter === 'due' ? chores.filter(isChoreDue) : chores),
        [chores, choresFilter]
      );

      // ==========================================================================
      // RENDER
      // ==========================================================================
      return (
        <div className="min-h-screen bg-slate-50 text-slate-900 pb-nav">
          {/* GÓRNY PASEK */}
          <header className="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200/80 safe-top">
            <div className="max-w-xl mx-auto px-4 pb-3 flex items-center justify-between gap-2">
              <div className="flex items-center gap-2.5 min-w-0">
                <div className="w-9 h-9 rounded-2xl bg-indigo-600 text-white flex items-center justify-center text-lg shadow-sm shrink-0">
                  🏡
                </div>
                <div className="min-w-0">
                  <h1 className="text-base font-extrabold tracking-tight text-slate-900 leading-tight truncate">
                    Nasz Dom
                  </h1>
                  <button
                    onClick={() => setShowSettingsModal(true)}
                    className="flex items-center gap-1 text-[11px] font-semibold text-slate-500"
                  >
                    <span
                      className={`w-2 h-2 rounded-full ${
                        syncStatus === 'synced'
                          ? 'bg-emerald-500'
                          : syncStatus === 'error'
                          ? 'bg-rose-500'
                          : syncStatus === 'connecting'
                          ? 'bg-amber-400 animate-pulse'
                          : 'bg-slate-300'
                      }`}
                    />
                    {syncStatus === 'synced'
                      ? 'Chmura aktywna'
                      : syncStatus === 'connecting'
                      ? 'Łączenie...'
                      : syncStatus === 'error'
                      ? 'Błąd chmury'
                      : 'Tryb lokalny (podepnij chmurę)'}
                  </button>
                </div>
              </div>

              <div className="flex items-center gap-1.5 shrink-0">
                <button
                  onClick={() => setActiveProfile((p) => (p === 'user1' ? 'user2' : 'user1'))}
                  className="px-3 py-1.5 rounded-2xl bg-indigo-50 border border-indigo-200/80 text-indigo-700 text-xs font-bold flex items-center gap-1.5 active:scale-95 transition-transform"
                  title="Zmień aktywny profil"
                >
                  <span>{activeProfile === 'user1' ? '🙋‍♂️' : '🙋‍♀️'}</span>
                  <span className="max-w-[72px] truncate">{activeUserName}</span>
                </button>
                <button
                  onClick={() => setShowSettingsModal(true)}
                  className="p-2 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-600 active:scale-95 transition-transform"
                  aria-label="Ustawienia"
                >
                  <Icon name="settings" className="w-4 h-4" />
                </button>
              </div>
            </div>
          </header>

          {/* GŁÓWNA TREŚĆ */}
          <main className="max-w-xl mx-auto px-4 pt-3 space-y-3">
            {/* BANER BŁĘDU CHMURY */}
            {syncError && (
              <div className="bg-rose-50 border border-rose-200 text-rose-800 rounded-2xl p-3 text-xs flex items-center justify-between gap-2">
                <span>⚠️ {syncError}</span>
                <button
                  onClick={() => setShowSettingsModal(true)}
                  className="px-2.5 py-1 bg-rose-600 text-white rounded-xl font-bold shrink-0"
                >
                  Napraw
                </button>
              </div>
            )}

            {/* BANER: PARTNER JEST W SKLEPIE */}
            {household.inStoreBy && (
              <div className="bg-emerald-600 text-white rounded-3xl p-3.5 shadow-sm flex items-center justify-between gap-3">
                <div className="flex items-center gap-2.5">
                  <div className="w-9 h-9 rounded-2xl bg-white/20 flex items-center justify-center shrink-0">
                    <Icon name="store" className="w-5 h-5" />
                  </div>
                  <div>
                    <p className="text-xs font-extrabold">
                      {household.inStoreBy === 'user1' ? household.user1Name : household.user2Name} jest teraz w sklepie! 🛒
                    </p>
                    <p className="text-[11px] text-emerald-100">
                      Dopisz szybciutko czego brakuje — pojawi się na żywo.
                    </p>
                  </div>
                </div>
                {household.inStoreBy === activeProfile && (
                  <button
                    onClick={toggleInStore}
                    className="px-2.5 py-1.5 bg-white/20 hover:bg-white/30 rounded-xl text-[11px] font-bold shrink-0"
                  >
                    Wyszłam/em
                  </button>
                )}
              </div>
            )}

            {/* BANER: SZTURCHNIĘCIE OBOWIĄZKOWE */}
            {household.nudge && household.nudge.from !== activeProfile && (
              <div className="bg-amber-50 border border-amber-200 rounded-3xl p-3.5 flex items-center justify-between gap-3">
                <div className="flex items-center gap-2.5">
                  <span className="text-xl">🔔</span>
                  <div>
                    <p className="text-xs font-bold text-amber-900">
                      {household.nudge.fromName} delikatnie przypomina:
                    </p>
                    <p className="text-xs text-amber-800">{household.nudge.choreTitle}</p>
                  </div>
                </div>
                <button
                  onClick={() => updateHouseholdField({ nudge: null })}
                  className="px-2.5 py-1.5 bg-amber-200/70 text-amber-900 rounded-xl text-[11px] font-bold shrink-0"
                >
                  Okej!
                </button>
              </div>
            )}

            {/* ==================================================================
                ZAKŁADKA 1: ZAKUPY + LODÓWKA
               ================================================================== */}
            {activeTab === 'shopping' && (
              <div className="space-y-4">
                {/* Przełącznik Lista vs Lodówka */}
                <div className="grid grid-cols-2 gap-1.5 bg-white p-1.5 rounded-3xl shadow-sm border border-slate-200/70">
                  <button
                    onClick={() => setShoppingSubTab('list')}
                    className={`py-2.5 px-3 rounded-2xl text-xs font-bold flex items-center justify-center gap-1.5 transition-all ${
                      shoppingSubTab === 'list' ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-600'
                    }`}
                  >
                    <Icon name="cart" className="w-4 h-4" />
                    Zakupy ({uncheckedShopping.length})
                  </button>
                  <button
                    onClick={() => setShoppingSubTab('fridge')}
                    className={`py-2.5 px-3 rounded-2xl text-xs font-bold flex items-center justify-center gap-1.5 transition-all ${
                      shoppingSubTab === 'fridge' ? 'bg-sky-600 text-white shadow-sm' : 'text-slate-600'
                    }`}
                  >
                    <Icon name="snowflake" className="w-4 h-4" />
                    Lodówka ({fridgeItems.length})
                  </button>
                </div>

                {shoppingSubTab === 'list' ? (
                  <>
                    {/* Formularz dodawania produktu + tryb w sklepie */}
                    <div className="bg-white rounded-3xl p-4 shadow-sm border border-slate-200/70 space-y-3">
                      <form onSubmit={handleQuickAddShopping} className="space-y-2">
                        <div className="flex gap-2">
                          <input
                            type="text"
                            value={newItemName}
                            onChange={(e) => setNewItemName(e.target.value)}
                            placeholder="Co trzeba kupić? (np. mleko, chleb)"
                            className="flex-1 bg-slate-50 border border-slate-200 rounded-2xl px-3.5 py-2.5 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500"
                          />
                          <button
                            type="submit"
                            className="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-bold flex items-center justify-center active:scale-95 transition-transform"
                          >
                            <Icon name="plus" className="w-5 h-5" />
                          </button>
                        </div>
                        <div className="flex items-center gap-2">
                          <input
                            type="text"
                            inputMode="decimal"
                            value={newItemAmount}
                            onChange={(e) => setNewItemAmount(e.target.value)}
                            className="w-20 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-center"
                            aria-label="Ilość"
                          />
                          <select
                            value={newItemUnit}
                            onChange={(e) => setNewItemUnit(e.target.value)}

    // ============================================================================
    // MODAL: DODAWANIE OBOWIĄZKU
    // ============================================================================
    function AddChoreModal({ user1Name, user2Name, onClose, onAdd }) {
      const [title, setTitle] = useState('');
      const [points, setPoints] = useState('15');
      const [frequency, setFrequency] = useState('co_tydzien');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!title.trim()) return;
        onAdd({
          title: title.trim(),
          points: Math.max(5, parseInt(points, 10) || 10),
          frequency,
          assignedTo: 'both'
        });
      };

      return (
        <div className="fixed inset-0 z-[60] bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
          <form
            onSubmit={handleSubmit}
            className="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 space-y-4 shadow-2xl safe-bottom"
          >
            <div className="flex items-center justify-between">
              <h3 className="font-bold text-base text-slate-900">Nowy obowiązek</h3>
              <button type="button" onClick={onClose} className="p-2 bg-slate-100 rounded-xl text-slate-500">
                <Icon name="x" className="w-4 h-4" />
              </button>
            </div>

            <div className="space-y-3">
              <div>
                <label className="text-xs font-bold text-slate-600">Nazwa zadania</label>
                <input
                  type="text"
                  value={title}
                  onChange={(e) => setTitle(e.target.value)}
                  placeholder="np. Mycie okien, podlanie kwiatków"
                  className="mt-1 w-full bg-slate-50 border border-slate-200 rounded-2xl px-3.5 py-2.5"
                  required
                />
              </div>

              <div className="grid grid-cols-2 gap-2.5">
                <div>
                  <label className="text-xs font-bold text-slate-600">Punkty</label>
                  <select
                    value={points}
                    onChange={(e) => setPoints(e.target.value)}
                    className="mt-1 w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2.5"
                  >
                    <option value="5">5 pkt (drobiazg)</option>
                    <option value="10">10 pkt (szybkie)</option>
                    <option value="15">15 pkt (średnie)</option>
                    <option value="20">20 pkt (większe)</option>
                    <option value="30">30 pkt (grube sprzątanie)</option>
                  </select>
                </div>
                <div>
                  <label className="text-xs font-bold text-slate-600">Częstotliwość</label>
                  <select
                    value={frequency}
                    onChange={(e) => setFrequency(e.target.value)}
                    className="mt-1 w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2.5"
                  >
                    {Object.entries(FREQUENCY_LABELS).map(([k, lbl]) => (
                      <option key={k} value={k}>{lbl}</option>
                    ))}
                  </select>
                </div>
              </div>
            </div>

            <button
              type="submit"
              className="w-full py-3 bg-indigo-600 text-white rounded-2xl text-sm font-bold shadow-sm"
            >
              Dodaj obowiązek
            </button>
          </form>
        </div>
      );
    }

                <p className="text-xs font-extrabold text-rose-600 uppercase tracking-wider">
                  🔥 Wasze wspólne Matche ({matches.length})

                    <span className="text-xs font-bold text-slate-900 truncate">
                      {m.emoji} {m.title}
