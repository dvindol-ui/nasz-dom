    function guessShoppingCategory(name) {
      const n = (name || '').toLowerCase();
      if (/(pomidor|ogórek|cebula|czosnek|szpinak|sałat|marchew|ziemniak|cukini|papryk|jabłk|banan|cytryn|koperek|bazyl|brokuł|pieczark|awokado|owoc|warzyw)/.test(n)) return 'warzywa';
      if (/(mleko|ser|parmezan|mozzarell|jogurt|śmietan|masło|jajk|twaróg|kefir)/.test(n)) return 'nabial';
      if (/(kurczak|indyk|mięso|schab|wołow|wieprz|szynk|boczek|kiełbas|łosoś|tuńczyk|ryba|krewet)/.test(n)) return 'mieso';
      if (/(chleb|bułk|tortill|bagiet|pieczyw|tost)/.test(n)) return 'pieczywo';
      if (/(makaron|ryż|kasza|mąka|płatki|ciecierzyc|fasol|gnocchi|soczewic)/.test(n)) return 'sypkie';
      if (/(sól|pieprz|oliw|olej|sos|passat|ketchup|musztard|majonez|przypraw|curry|oregano|cukier|mleczko kokos|suszone)/.test(n)) return 'przyprawy';
      if (/(papier|mydło|płyn|kapsułk|proszek|worki|ręcznik|pasta do zębów|szampon)/.test(n)) return 'chemia';
      return 'inne';
    }

    function parseSafeNumber(val, fallback = 1) {
      if (typeof val === 'number' && !Number.isNaN(val)) return val;
      const n = parseFloat(String(val || '').replace(',', '.'));
      return Number.isNaN(n) ? fallback : n;
    }

    function formatAmount(num) {
      const n = Math.round(parseSafeNumber(num, 1) * 10) / 10;
      return Number.isInteger(n) ? String(n) : String(n).replace('.', ',');
    }

    function formatMealCount(n) {
      if (n === 1) return '1 posiłek';
      const mod10 = n % 10;
      const mod100 = n % 100;
      if (mod10 >= 2 && mod10 <= 4 && !(mod100 >= 12 && mod100 <= 14)) return `${n} posiłki`;
      return `${n} posiłków`;
    }

    // Obsługa nowego formatu (śniadanie/obiad/kolacja) + wsteczna zgodność ze starym planem obiadów
    function getDayMeals(plan, dayId) {
      const raw = plan?.[dayId];
      if (!raw || typeof raw !== 'object') return {};
      if (raw.recipeId || raw.title) {
        return { lunch: raw };
      }
      return {
        breakfast: raw.breakfast || null,
        lunch: raw.lunch || null,
        dinner: raw.dinner || null
      };
    function compressImageFile(file, maxDim = 1200, quality = 0.8) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Nie udało się odczytać zdjęcia.'));
        reader.onload = (ev) => {
          const img = new Image();
          img.onerror = () => reject(new Error('Niepoprawny plik graficzny.'));
          img.onload = () => {
            let w = img.width;
            let h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
              else { w = Math.round((w * maxDim) / h); h = maxDim; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            resolve({ dataUrl, base64: dataUrl.split(',')[1], mime: 'image/jpeg' });
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function fetchGeminiWithBackoff(apiKey, payload, maxRetries = 3) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${encodeURIComponent(apiKey || '')}`;
      let delay = 1000;
      for (let attempt = 0; attempt <= maxRetries; attempt++) {
        try {
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (res.ok) return await res.json();
          if (res.status === 429 || res.status >= 500) {
            if (attempt < maxRetries) {
              await new Promise((r) => setTimeout(r, delay));
              delay *= 2;
              continue;
            }
          }
          const errJson = await res.json().catch(() => ({}));
          throw new Error(errJson?.error?.message || `Błąd API Gemini (${res.status}) — sprawdź klucz w Ustawieniach.`);
        } catch (err) {
          if (attempt < maxRetries && !String(err.message || '').includes('Błąd API Gemini')) {
            await new Promise((r) => setTimeout(r, delay));
            delay *= 2;
            continue;
          }
          throw err;
        }
      }
      throw new Error('Przekroczono limit prób połączenia z AI.');
    }

    function isChoreDue(chore) {
      if (!chore.lastDoneAt) return true;
      if (chore.frequency === 'jednorazowe') return false;
      const days = FREQUENCY_DAYS[chore.frequency] || 1;
      const diffHours = (Date.now() - chore.lastDoneAt) / (1000 * 60 * 60);
      return diffHours >= days * 20;
    }

    function bootstrapInitialSettings() {
      try {
        const hash = window.location.hash || '';
        const lastApplied = localStorage.getItem('naszdom_last_hash');
        if (hash.startsWith('#setup=') && hash !== lastApplied) {
          const payload = decodeSetupPayload(hash.slice(7));
          if (payload.firebaseConfig) {
            localStorage.setItem('naszdom_fb_config', JSON.stringify(payload.firebaseConfig));
          }
          if (payload.houseCode) {
            localStorage.setItem('naszdom_house_code', payload.houseCode);
          }
          if (payload.profile === 'user1' || payload.profile === 'user2') {
            localStorage.setItem('naszdom_profile', payload.profile);
          }
          if (payload.geminiKey) {
            localStorage.setItem('naszdom_gemini_key', payload.geminiKey);
          }
          localStorage.setItem('naszdom_last_hash', hash);
        }
      } catch (err) {
        console.warn('Nie udało się odczytać linku startowego:', err);
      }

      let fbConfig = DEFAULT_FIREBASE_CONFIG;
      try {
        const saved = localStorage.getItem('naszdom_fb_config');
        if (saved) fbConfig = JSON.parse(saved);
      } catch (_) {}

      return {
        fbConfig,
        houseCode: localStorage.getItem('naszdom_house_code') || 'nasz-dom-2026',
        profile: localStorage.getItem('naszdom_profile') || 'user1',
        geminiKey: localStorage.getItem('naszdom_gemini_key') || ''

        const db = dbRef.current;
        setSyncStatus('connecting');
        setSyncError('');

        const houseDocRef = db.doc(`${colPath('households')}/${cleanHouseId}`);

        const unsubHouse = houseDocRef.onSnapshot(
          (snap) => {
            if (snap.exists) {
              const data = snap.data();
              setHousehold((prev) => ({ ...defaultHousehold, ...prev, ...data }));
            } else {
              houseDocRef
                .set({
                  ...defaultHousehold,
                  choresSeeded: false,
                  createdAt: Date.now()
                })
                .catch((e) => console.warn('Błąd tworzenia dokumentu domu:', e));
            }
            setSyncStatus('synced');
          },
          (err) => {
            console.warn('Błąd synchronizacji domu:', err);
            setSyncStatus('error');
            setSyncError('Brak dostępu do Firestore — sprawdź zakładkę Rules w Firebase.');
          }
        );

        const unsubShopping = db
          .collection(colPath('shopping'))
          .where('houseCode', '==', cleanHouseId)
          .onSnapshot(
            (snap) => {
              const items = snap.docs
                .map((d) => ({ id: d.id, ...d.data() }))
                .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
              setShoppingItems(items);
            },
            (err) => console.warn('Błąd synchronizacji zakupów:', err)
          );

        const unsubFridge = db
          .collection(colPath('fridge'))
          .where('houseCode', '==', cleanHouseId)
          .onSnapshot(
            (snap) => {
              const items = snap.docs
                .map((d) => ({ id: d.id, ...d.data() }))
                .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
              setFridgeItems(items);
            },
            (err) => console.warn('Błąd synchronizacji lodówki:', err)
          );

        const unsubChores = db
          .collection(colPath('chores'))
          .where('houseCode', '==', cleanHouseId)
          .onSnapshot(
            async (snap) => {
              const items = snap.docs
                .map((d) => ({ id: d.id, ...d.data() }))
                .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
              if (items.length === 0 && !householdRef.current.choresSeeded) {
                try {
                  const hSnap = await houseDocRef.get();
                  if (!hSnap.exists || !hSnap.data()?.choresSeeded) {
                    await houseDocRef.set({ choresSeeded: true }, { merge: true });
                    const now = Date.now();
                    for (let i = 0; i < STARTER_CHORES.length; i++) {
                      const sc = STARTER_CHORES[i];
                      await db.collection(colPath('chores')).add({
                        title: sc.title,
                        frequency: sc.frequency,
                        assignedTo: sc.assignedTo,
                        houseCode: cleanHouseId,
                        lastDoneAt: null,
                        lastDoneBy: null,
                        createdAt: now + i
                      });
                    }
                    return;
                  }
                } catch (e) {
                  console.warn('Błąd inicjalizacji obowiązków:', e);
                }
              }
              setChores(items);
            },
            (err) => console.warn('Błąd synchronizacji obowiązków:', err)
          );

        const unsubRecipes = db
          .collection(colPath('recipes'))
          .where('houseCode', '==', cleanHouseId)
          .onSnapshot(
            (snap) => {
              const items = snap.docs
                .map((d) => ({ id: d.id, ...d.data() }))
                .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
              setCustomRecipes(items);
            },
            (err) => console.warn('Błąd synchronizacji przepisów:', err)
          );

        return () => {
          unsubHouse();
          unsubShopping();
          unsubFridge();
          unsubChores();
          unsubRecipes();
        };
      }, [authUser, cleanHouseId]);

      // POPRAWIONA funkcja aktualizacji domu (mergeFields naprawia usuwanie dni z Planera!)
      const updateHouseholdField = async (patch) => {
        householdRef.current = { ...householdRef.current, ...patch };
        setHousehold((prev) => ({ ...prev, ...patch }));
        if (!dbRef.current || !authUser) return;
        try {
          const ref = dbRef.current.doc(`${colPath('households')}/${cleanHouseId}`);
          await ref.set(patch, { mergeFields: Object.keys(patch) });
        } catch (err) {
          console.warn('Nie udało się zapisać ustawień domu:', err);
        }
      };

      const activeUserName = activeProfile === 'user1' ? household.user1Name : household.user2Name;
      const partnerUserName = activeProfile === 'user1' ? household.user2Name : household.user1Name;

      // ==========================================================================
      // OPERACJE: ZAKUPY I LODÓWKA
      // ==========================================================================
      const addShoppingItem = async (itemData) => {
        const cleanName = (itemData.name || '').trim();
        if (!cleanName) return;
        const unit = (itemData.unit || 'szt.').trim();
        const amount = parseSafeNumber(itemData.amount, 1) || 1;
        const category = itemData.category || guessShoppingCategory(cleanName);

        // Jeśli produkt już jest na liście (niekupiony, ta sama jednostka) — zsumuj ilość
        const existing = shoppingItems.find(
          (i) =>
            !i.checked &&
            (i.name || '').trim().toLowerCase() === cleanName.toLowerCase() &&
            (i.unit || '').trim().toLowerCase() === unit.toLowerCase()
        );

        if (existing) {
          const nextAmount = Math.round(((Number(existing.amount) || 0) + amount) * 10) / 10;
          if (dbRef.current && authUser) {
            await dbRef.current.doc(`${colPath('shopping')}/${existing.id}`).update({ amount: nextAmount });
          } else {
            setShoppingItems((prev) => prev.map((i) => (i.id === existing.id ? { ...i, amount: nextAmount } : i)));
          }
          return;
        }

        const newItem = {
          name: cleanName,
          amount,
          unit,
          category,
          checked: false,
          addedBy: activeProfile,
          houseCode: cleanHouseId,
          createdAt: Date.now()
        };

        if (dbRef.current && authUser) {
          await dbRef.current.collection(colPath('shopping')).add(newItem);
        } else {
          setShoppingItems((prev) => [{ id: `loc-${Date.now()}-${Math.random()}`, ...newItem }, ...prev]);
        }
      };

      const handleQuickAddShopping = async (e) => {
        e.preventDefault();
        if (!newItemName.trim()) return;
        await addShoppingItem({ name: newItemName, amount: newItemAmount, unit: newItemUnit });
        setNewItemName('');
        setNewItemAmount('1');
        setNewItemUnit('szt.');
      };

      const toggleShoppingItem = async (item) => {
        const nextChecked = !item.checked;
        if (dbRef.current && authUser) {
          await dbRef.current.doc(`${colPath('shopping')}/${item.id}`).update({ checked: nextChecked });
        } else {
          setShoppingItems((prev) => prev.map((i) => (i.id === item.id ? { ...i, checked: nextChecked } : i)));
        }
      };

      const deleteShoppingItem = async (item) => {
        if (dbRef.current && authUser) {
          await dbRef.current.doc(`${colPath('shopping')}/${item.id}`).delete();
        } else {
          setShoppingItems((prev) => prev.filter((i) => i.id !== item.id));
        }
      };

      const addOrMergeFridgeItem = async ({ name, amount, unit, category }) => {
        const cleanName = (name || '').trim();
        if (!cleanName) return;
        const cleanUnit = (unit || 'szt.').trim();
        const addAmt = parseSafeNumber(amount, 1) || 1;

        const existing = fridgeItems.find(
          (f) =>
            (f.name || '').trim().toLowerCase() === cleanName.toLowerCase() &&
            (f.unit || '').trim().toLowerCase() === cleanUnit.toLowerCase()
        );

        if (existing) {
          const nextAmount = Math.round(((Number(existing.amount) || 0) + addAmt) * 10) / 10;
          if (dbRef.current && authUser) {
            await dbRef.current
              .doc(`${colPath('fridge')}/${existing.id}`)
              .update({ amount: nextAmount, updatedAt: Date.now() });
          } else {
            setFridgeItems((prev) =>
              prev.map((f) => (f.id === existing.id ? { ...f, amount: nextAmount, updatedAt: Date.now() } : f))
            );
          }
          return;
        }

        const entry = {
          name: cleanName,
          amount: addAmt,
          unit: cleanUnit,
          category: category || guessShoppingCategory(cleanName),
          houseCode: cleanHouseId,
          updatedAt: Date.now()
        };

        if (dbRef.current && authUser) {
          await dbRef.current.collection(colPath('fridge')).add(entry);
        } else {
          setFridgeItems((prev) => [{ id: `fr-${Date.now()}-${Math.random()}`, ...entry }, ...prev]);
        }
      };

      const clearCheckedToFridge = async () => {
        const checked = shoppingItems.filter((i) => i.checked);
        if (checked.length === 0) return;
        try {
          for (const item of checked) {
            if (item.category !== 'chemia') {
              await addOrMergeFridgeItem(item);
            }
            if (dbRef.current && authUser) {
              await dbRef.current.doc(`${colPath('shopping')}/${item.id}`).delete();
            }
          }
          if (!dbRef.current || !authUser) {
            setShoppingItems((prev) => prev.filter((i) => !i.checked));
          }
          if (household.inStoreBy === activeProfile) {
            await updateHouseholdField({ inStoreBy: null, inStoreAt: null });
          }
          showToast(`Wyczyszczono koszyk — ${checked.length} prod. przeniesiono do Lodówki ❄️`);
        } catch (err) {
          console.warn('Błąd czyszczenia koszyka:', err);
          showToast('Nie udało się wyczyścić koszyka', 'error');
        }
      };

      const updateFridgeAmount = async (item, delta) => {
        const nextAmount = Math.round(((Number(item.amount) || 0) + delta) * 10) / 10;
        if (nextAmount <= 0) {
          if (dbRef.current && authUser) {
            await dbRef.current.doc(`${colPath('fridge')}/${item.id}`).delete();
          } else {
            setFridgeItems((prev) => prev.filter((f) => f.id !== item.id));
          }
          return;
        }
        if (dbRef.current && authUser) {
          await dbRef.current
            .doc(`${colPath('fridge')}/${item.id}`)
            .update({ amount: nextAmount, updatedAt: Date.now() });
        } else {
          setFridgeItems((prev) => prev.map((f) => (f.id === item.id ? { ...f, amount: nextAmount } : f)));
        }
      };

      const handleQuickAddFridge = async (e) => {
        e.preventDefault();
        if (!newFridgeName.trim()) return;
        await addOrMergeFridgeItem({ name: newFridgeName, amount: newFridgeAmount, unit: newFridgeUnit });
        setNewFridgeName('');
        setNewFridgeAmount('1');
        setNewFridgeUnit('szt.');
        showToast('Dodano do Lodówki ❄️');
      };

      const toggleInStore = async () => {
        const amIInStore = household.inStoreBy === activeProfile;
        await updateHouseholdField({
          inStoreBy: amIInStore ? null : activeProfile,
          inStoreAt: amIInStore ? null : Date.now()
        });
        showToast(
          amIInStore
            ? 'Zakończono tryb sklepowy'
            : `Włączono tryb „W sklepie” — ${partnerUserName} widzi powiadomienie! 🏪`
        );
      };

      // ==========================================================================
      // OPERACJE: OBOWIĄZKI (BEZ PUNKTACJI)
      // ==========================================================================
      const handleAddChore = async (choreData) => {
        const entry = {
          ...choreData,
          houseCode: cleanHouseId,
          lastDoneAt: null,
          lastDoneBy: null,
          createdAt: Date.now()
        };
        if (dbRef.current && authUser) {
          await dbRef.current.collection(colPath('chores')).add(entry);
        } else {
          setChores((prev) => [...prev, { id: `ch-${Date.now()}`, ...entry }]);
        }
        setShowAddChoreModal(false);
        showToast('Dodano nowy obowiązek ✅');
      };

      const completeChore = async (chore) => {
        const now = Date.now();
        if (dbRef.current && authUser) {
          await dbRef.current.doc(`${colPath('chores')}/${chore.id}`).update({
            lastDoneAt: now,
            lastDoneBy: activeProfile
          });
        } else {
          setChores((prev) =>
            prev.map((c) => (c.id === chore.id ? { ...c, lastDoneAt: now, lastDoneBy: activeProfile } : c))
          );
        }
        showToast(`Odznaczono: ${chore.title} ✅`);
      };

      const undoChore = async (chore) => {
        if (dbRef.current && authUser) {
          await dbRef.current.doc(`${colPath('chores')}/${chore.id}`).update({
            lastDoneAt: null,
            lastDoneBy: null
          });
        } else {
          setChores((prev) =>
            prev.map((c) => (c.id === chore.id ? { ...c, lastDoneAt: null, lastDoneBy: null } : c))
          );
        }
        showToast('Przywrócono na listę do zrobienia');
      };

      const deleteChore = async (chore) => {
        if (dbRef.current && authUser) {
          await dbRef.current.doc(`${colPath('chores')}/${chore.id}`).delete();
        } else {
          setChores((prev) => prev.filter((c) => c.id !== chore.id));
        }
        showToast('Usunięto obowiązek');
      };

      const sendNudge = async (chore) => {
        await updateHouseholdField({
          nudge: {
            from: activeProfile,
            fromName: activeUserName,
            choreTitle: chore.title,
            sentAt: Date.now()
          }
        });
        showToast(`Wysłano przypomnienie do: ${partnerUserName} 🔔`);
      };

      // ==========================================================================
      // OPERACJE: PRZEPISY, TINDER NA OBIAD I PLANER TYGODNIA
      // ==========================================================================
      const saveNewRecipe = async (recipeData) => {
        const entry = {
          ...recipeData,
          votes: { [activeProfile]: 'yes' },
          houseCode: cleanHouseId,
          createdAt: Date.now()
        };
        if (dbRef.current && authUser) {
          await dbRef.current.collection(colPath('recipes')).add(entry);
        } else {
          setCustomRecipes((prev) => [{ id: `rec-${Date.now()}`, ...entry }, ...prev]);
        }
        setImportModalMode(null);
        showToast(`Zapisano przepis: ${recipeData.title} 🍽️`);
      };

      const deleteRecipe = async (recipe) => {
        if (String(recipe.id || '').startsWith('starter-')) return;
        if (dbRef.current && authUser) {
          await dbRef.current.doc(`${colPath('recipes')}/${recipe.id}`).delete();
        } else {
          setCustomRecipes((prev) => prev.filter((r) => r.id !== recipe.id));
        }
        setSelectedRecipeId(null);
        showToast('Usunięto przepis');
      };

      const voteRecipe = async (recipe, vote) => {
        const isStarter = String(recipe.id || '').startsWith('starter-');
        const nextVotes = { ...(recipe.votes || {}), [activeProfile]: vote };

        if (isStarter) {
          const nextStarterVotes = {
            ...(householdRef.current.starterVotes || {}),
            [recipe.id]: nextVotes
          };
          await updateHouseholdField({ starterVotes: nextStarterVotes });
        } else if (dbRef.current && authUser) {
          await dbRef.current.doc(`${colPath('recipes')}/${recipe.id}`).update({ votes: nextVotes });
        } else {
          setCustomRecipes((prev) => prev.map((r) => (r.id === recipe.id ? { ...r, votes: nextVotes } : r)));
        }

        if (nextVotes.user1 === 'yes' && nextVotes.user2 === 'yes') {
          showToast(`🔥 MAMY MATCH! Oboje chcecie: ${recipe.title}`);
        }
      };

      const resetAllVotes = async () => {
        try {
          await updateHouseholdField({ starterVotes: {} });
          if (dbRef.current && authUser) {
            for (const r of customRecipes) {
              await dbRef.current.doc(`${colPath('recipes')}/${r.id}`).update({ votes: {} });
            }
          } else {
            setCustomRecipes((prev) => prev.map((r) => ({ ...r, votes: {} })));
          }
          showToast('Zresetowano głosy – możecie wybierać na nowo!');
        } catch (err) {
          console.warn('Błąd resetowania głosów:', err);
          showToast('Nie udało się zresetować wszystkich głosów', 'error');
        }
      };

      const openRecipeIngredientsModal = (recipe, mult = 1) => {
        const items = (recipe.ingredients || []).map((ing, idx) => {
          const cleanName = (ing.name || '').trim();
          const unit = (ing.unit || 'szt.').trim();
          const scaled = Math.round((parseSafeNumber(ing.amount, 1) || 1) * mult * 10) / 10;
          const ingLower = cleanName.toLowerCase();

          const matchedInFridge = fridgeItems.find((fi) => {
            const fiLower = (fi.name || '').trim().toLowerCase();
            if (fiLower.length < 3 || ingLower.length < 3) return fiLower === ingLower;
            return ingLower.includes(fiLower) || fiLower.includes(ingLower);
          });

          let neededAmount = scaled;
          let coveredByFridge = false;
          if (matchedInFridge) {
            const sameUnit = (matchedInFridge.unit || '').trim().toLowerCase() === unit.toLowerCase();
            if (sameUnit) {
              const rem = Math.round((scaled - (Number(matchedInFridge.amount) || 0)) * 10) / 10;
              if (rem <= 0) coveredByFridge = true;
              else neededAmount = rem;
            } else {
              coveredByFridge = true;
            }
          }

          return {
            name: cleanName,
            unit,
            category: ing.category || guessShoppingCategory(cleanName),
            isPantry: !!ing.isPantry,
            idx,
            inFridge: matchedInFridge || null,
            scaledAmount: neededAmount,
            selected: !ing.isPantry && !coveredByFridge
          };
        });

        setAddToCartModal({
          recipeTitle: recipe.title,
          items
        });
      };

      const confirmAddIngredientsToCart = async () => {
        if (!addToCartModal) return;
        const toAdd = addToCartModal.items.filter((i) => i.selected);
        if (toAdd.length === 0) {
          setAddToCartModal(null);
          return;
        }
        for (const item of toAdd) {
          await addShoppingItem({
            name: item.name,
            amount: item.scaledAmount,
            unit: item.unit,
            category: item.category
          });
        }
        setAddToCartModal(null);
        showToast(`Dodano ${toAdd.length} składników na listę zakupów! 🛒`);
      };

      // --- PLANER POSIŁKÓW (ŚNIADANIE, OBIAD, KOLACJA • PON–ND) ---
      const mealPlan = household.mealPlan || {};
      const todayJsDay = new Date().getDay();

      const plannedMealsCount = useMemo(() => {
        let count = 0;
        for (const d of WEEK_DAYS) {
          const dayMeals = getDayMeals(mealPlan, d.id);
          for (const slot of MEAL_SLOTS) {
            if (dayMeals[slot.id]?.title) count++;
          }
        }
        return count;
      }, [mealPlan]);

      const uncookedPlannedMealsCount = useMemo(() => {
        let count = 0;
        for (const d of WEEK_DAYS) {
          const dayMeals = getDayMeals(mealPlan, d.id);
          for (const slot of MEAL_SLOTS) {
            if (dayMeals[slot.id]?.title && !dayMeals[slot.id]?.cooked) count++;
          }
        }
        return count;
      }, [mealPlan]);

      const assignMealToSlot = async (dayId, slotId, recipeOrCustom, servingsCount = null) => {
        const slotObj = MEAL_SLOTS.find((s) => s.id === slotId) || MEAL_SLOTS[1];
        const existingDay = { ...getDayMeals(householdRef.current.mealPlan, dayId) };
        const isCustom = Boolean(recipeOrCustom.isCustom);

        existingDay[slotId] = {
          recipeId: isCustom ? null : recipeOrCustom.id,
          starterId: isCustom
            ? null
            : recipeOrCustom.starterId || (String(recipeOrCustom.id || '').startsWith('starter-') ? recipeOrCustom.id : null),
          isCustom,
          title: recipeOrCustom.title,
          emoji: recipeOrCustom.emoji || slotObj.emoji,
          prepTime: recipeOrCustom.prepTime || (isCustom ? null : 25),
          servings: servingsCount || recipeOrCustom.servings || 2,
          cooked: false,
          plannedBy: activeProfile,
          plannedAt: Date.now()
        };

        const nextPlan = {
          ...(householdRef.current.mealPlan || {}),
          [dayId]: existingDay
        };
        await updateHouseholdField({ mealPlan: nextPlan });
        const dayObj = WEEK_DAYS.find((d) => d.id === dayId);
        showToast(`Zaplanowano (${slotObj.label}, ${dayObj?.short || dayId}): ${recipeOrCustom.title} 📅`);
      };

      const updateMealPlanSlot = async (dayId, slotId, patch) => {
        const existingDay = { ...getDayMeals(householdRef.current.mealPlan, dayId) };
        if (!existingDay[slotId]) return;
        existingDay[slotId] = { ...existingDay[slotId], ...patch };
        const nextPlan = {
          ...(householdRef.current.mealPlan || {}),
          [dayId]: existingDay
        };
        await updateHouseholdField({ mealPlan: nextPlan });
      };

      const removeMealPlanSlot = async (dayId, slotId) => {
        const existingDay = { ...getDayMeals(householdRef.current.mealPlan, dayId) };
        delete existingDay[slotId];
        const nextPlan = { ...(householdRef.current.mealPlan || {}) };
        const hasAny = MEAL_SLOTS.some((s) => existingDay[s.id]?.title);
        if (hasAny) {
          nextPlan[dayId] = existingDay;
        } else {
          delete nextPlan[dayId];
        }
        await updateHouseholdField({ mealPlan: nextPlan });
        showToast('Usunięto posiłek z planu');
      };

      const clearMealPlan = async () => {
        await updateHouseholdField({ mealPlan: {} });
        setConfirmClearPlan(false);
        showToast('Wyczyszczono cały plan posiłków na ten tydzień 🧹');
      };

      const randomizeMissingLunches = async () => {
        if (recipes.length === 0) return;
        const currentPlan = { ...(householdRef.current.mealPlan || {}) };
        const usedIds = new Set();
        const emptyDays = [];

        for (const day of WEEK_DAYS) {
          const dayMeals = getDayMeals(currentPlan, day.id);
          if (dayMeals.lunch?.recipeId) usedIds.add(dayMeals.lunch.recipeId);
          if (!dayMeals.lunch?.title) emptyDays.push(day);
        }

        if (emptyDays.length === 0) {
          showToast('Wszystkie obiady w tygodniu są już zaplanowane! 📅', 'info');
          return;
        }

        // Preferujemy przepisy obiadowe (nie typowo śniadaniowe) i Wasze Matche
        const lunchCandidates = recipes.filter((r) => !(r.tags || []).includes('sniadanie'));
        const poolBase = lunchCandidates.length > 0 ? lunchCandidates : recipes;

        const matchPool = poolBase.filter(
          (r) => r.votes?.user1 === 'yes' && r.votes?.user2 === 'yes' && !usedIds.has(r.id)
        );
        const otherPool = poolBase.filter(
          (r) => !usedIds.has(r.id) && !matchPool.some((m) => m.id === r.id)
        );
        const shuffled = [
          ...matchPool.sort(() => Math.random() - 0.5),
          ...otherPool.sort(() => Math.random() - 0.5)
        ];

        let idx = 0;
        for (const day of emptyDays) {
          const pick = shuffled[idx] || poolBase[Math.floor(Math.random() * poolBase.length)];
          idx++;
          const existingDay = { ...getDayMeals(currentPlan, day.id) };
          existingDay.lunch = {
            recipeId: pick.id,
            starterId: pick.starterId || (String(pick.id || '').startsWith('starter-') ? pick.id : null),
            isCustom: false,
            title: pick.title,
            emoji: pick.emoji || '🍽️',
            prepTime: pick.prepTime || 25,
            servings: pick.servings || 2,
            cooked: false,
            plannedBy: activeProfile,
            plannedAt: Date.now()
          };
          currentPlan[day.id] = existingDay;
        }
        await updateHouseholdField({ mealPlan: currentPlan });
        showToast(`Wylosowano obiady na ${emptyDays.length} wolnych dni! 🎲`);
      };

      const openWeeklyPlanShoppingModal = () => {
        const activeEntries = [];
        for (const day of WEEK_DAYS) {
          const dayMeals = getDayMeals(mealPlan, day.id);
          for (const slot of MEAL_SLOTS) {
            const entry = dayMeals[slot.id];
            if (entry?.title && !entry.cooked) {
              activeEntries.push({ day, slot, entry });
            }
          }
        }

        if (activeEntries.length === 0) {
          showToast('Najpierw zaplanuj przynajmniej jeden nieprzygotowany posiłek 📅', 'info');
          return;
        }

        const mergedMap = new Map();
        let matchedRecipeCount = 0;

        for (const { day, slot, entry } of activeEntries) {
          if (!entry.recipeId && !entry.starterId) continue;
          const recipe = recipes.find(
            (r) =>
              r.id === entry.recipeId ||
              (entry.starterId && (r.id === entry.starterId || r.starterId === entry.starterId))
          );
          if (!recipe) continue;
          matchedRecipeCount++;

          const baseServings = Number(recipe.servings) || 2;
          const plannedServings = Number(entry.servings) || baseServings;
          const mult = plannedServings / baseServings;
          const dayTag = `${day.short} (${slot.short})`;

          for (const ing of recipe.ingredients || []) {
            const cleanName = (ing.name || '').trim();
            if (!cleanName) continue;
            const unit = (ing.unit || 'szt.').trim();
            const key = `${cleanName.toLowerCase()}__${unit.toLowerCase()}`;
            const scaled = (parseSafeNumber(ing.amount, 1) || 1) * mult;

            if (mergedMap.has(key)) {
              const existing = mergedMap.get(key);
              existing.scaledAmount = Math.round((existing.scaledAmount + scaled) * 10) / 10;
              if (!existing.days.includes(dayTag)) existing.days.push(dayTag);
              if (!ing.isPantry) existing.isPantry = false;
            } else {
              mergedMap.set(key, {
                name: cleanName,
                unit,
                category: ing.category || guessShoppingCategory(cleanName),
                isPantry: !!ing.isPantry,
                scaledAmount: Math.round(scaled * 10) / 10,
                days: [dayTag]
              });
            }
          }
        }

        if (mergedMap.size === 0) {
          showToast('Zaplanowane pozycje nie mają przypisanych przepisów ze składnikami.', 'info');
          return;
        }

        const aggregatedItems = Array.from(mergedMap.values()).map((ing, idx) => {
          const ingLower = ing.name.toLowerCase();
          const matchedInFridge = fridgeItems.find((fi) => {
            const fiLower = (fi.name || '').trim().toLowerCase();
            if (fiLower.length < 3 || ingLower.length < 3) return fiLower === ingLower;
            return ingLower.includes(fiLower) || fiLower.includes(ingLower);
          });

          let neededAmount = ing.scaledAmount;
          let coveredByFridge = false;
          if (matchedInFridge) {
            const sameUnit = (matchedInFridge.unit || '').trim().toLowerCase() === ing.unit.toLowerCase();
            if (sameUnit) {
              const rem = Math.round((ing.scaledAmount - (Number(matchedInFridge.amount) || 0)) * 10) / 10;
              if (rem <= 0) coveredByFridge = true;
              else neededAmount = rem;
            } else {
              coveredByFridge = true;
            }
          }

          return {
            ...ing,
            idx,
            inFridge: matchedInFridge || null,
            scaledAmount: neededAmount,
            selected: !ing.isPantry && !coveredByFridge
          };
        });

        setAddToCartModal({
          recipeTitle: `Plan tygodnia (${formatMealCount(matchedRecipeCount)})`,
          items: aggregatedItems
        });
      };

      // ==========================================================================
      // DANE POCHODNE DO RENDEROWANIA
      // ==========================================================================
      const uncheckedShopping = shoppingItems.filter((i) => !i.checked);
      const checkedShopping = shoppingItems.filter((i) => i.checked);

      const groupedShopping = useMemo(() => {
        const groups = {};
        for (const item of uncheckedShopping) {
          const cat = item.category || 'inne';
          if (!groups[cat]) groups[cat] = [];
          groups[cat].push(item);
        }
        return SHOPPING_CATEGORIES.filter((c) => groups[c.id]?.length > 0).map((c) => ({
          ...c,
          items: groups[c.id]
        }));
      }, [uncheckedShopping]);

      const matchCount = useMemo(
        () => recipes.filter((r) => r.votes?.user1 === 'yes' && r.votes?.user2 === 'yes').length,
        [recipes]
      );

      const filteredRecipes = useMemo(() => {
        const q = recipeSearch.trim().toLowerCase();
        return recipes.filter((r) => {
          if (selectedTag === 'matches') {
            if (!(r.votes?.user1 === 'yes' && r.votes?.user2 === 'yes')) return false;
          } else if (selectedTag !== 'all') {
            if (!(r.tags || []).includes(selectedTag)) return false;
          }
          if (!q) return true;
          return (
            (r.title || '').toLowerCase().includes(q) ||
            (r.ingredients || []).some((i) => (i.name || '').toLowerCase().includes(q))
          );
        });
      }, [recipes, recipeSearch, selectedTag]);

      const visibleChores = useMemo(
        () => (choresFilter === 'due' ? chores.filter(isChoreDue) : chores),
        [chores, choresFilter]
      );

      // ==========================================================================
      // RENDER
      // ==========================================================================
      return (
        <div className="min-h-screen bg-slate-50 text-slate-900 pb-nav">

              <div className="flex items-center gap-2.5 min-w-0">
                <div className="w-9 h-9 rounded-2xl bg-indigo-600 text-white flex items-center justify-center text-lg shadow-sm shrink-0">
                  🏡
                </div>
                <div className="min-w-0">
                  <h1 className="text-base font-extrabold tracking-tight text-slate-900 leading-tight truncate">
                    Nasz Dom
                  </h1>
                  <button
                    onClick={() => setShowSettingsModal(true)}
                    className="flex items-center gap-1 text-[11px] font-semibold text-slate-500"
                  >
                    <span
                      className={`w-2 h-2 rounded-full ${
                        syncStatus === 'synced'
                          ? 'bg-emerald-500'
                          : syncStatus === 'error'
                          ? 'bg-rose-500'
                          : syncStatus === 'connecting'
                          ? 'bg-amber-400 animate-pulse'
                          : 'bg-slate-300'
                      }`}
                    />
                    {syncStatus === 'synced'
                      ? 'Chmura aktywna'
                      : syncStatus === 'connecting'
                      ? 'Łączenie...'
                      : syncStatus === 'error'
                      ? 'Błąd chmury'
                      : 'Tryb lokalny (podepnij chmurę)'}
                  </button>
                </div>
              </div>

              <div className="flex items-center gap-1.5 shrink-0">
                <button
                  onClick={() => setActiveProfile((p) => (p === 'user1' ? 'user2' : 'user1'))}
                  className="px-3 py-1.5 rounded-2xl bg-indigo-50 border border-indigo-200/80 text-indigo-700 text-xs font-bold flex items-center gap-1.5 active:scale-95 transition-transform"
                  title="Zmień aktywny profil"
                >
                  <span>{activeProfile === 'user1' ? '🙋‍♂️' : '🙋‍♀️'}</span>
                  <span className="max-w-[72px] truncate">{activeUserName}</span>
                </button>
                <button
                  onClick={() => setShowSettingsModal(true)}
                  className="p-2 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-600 active:scale-95 transition-transform"
                  aria-label="Ustawienia"
                >
                  <Icon name="settings" className="w-4 h-4" />
                </button>
              </div>
            </div>
          </header>

          {/* GŁÓWNA TREŚĆ */}
          <main className="max-w-xl mx-auto px-4 pt-3 space-y-3">
            {/* BANER BŁĘDU CHMURY */}
            {syncError && (
              <div className="bg-rose-50 border border-rose-200 text-rose-800 rounded-2xl p-3 text-xs flex items-center justify-between gap-2">
                <span>⚠️ {syncError}</span>
                <button

                  Napraw
                </button>
              </div>

            {/* BANER: PARTNER JEST W SKLEPIE */}
            {household.inStoreBy && (

                <div className="flex items-center gap-2.5">
                  <div className="w-9 h-9 rounded-2xl bg-white/20 flex items-center justify-center shrink-0">

                  </div>

                {household.inStoreBy === activeProfile && (

            {/* BANER: SZTURCHNIĘCIE OBOWIĄZKOWE */}

            {/* ==================================================================

                        <button

                          <Icon name="plus" className="w-5 h-5" />

                      <div className="flex items-center gap-2">
                        <input

                        <select

                          className="bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2"
                          aria-label="Jednostka"
                        >
                          <option value="szt.">szt.</option>
                          <option value="g">g</option>
                          <option value="kg">kg</option>
                          <option value="ml">ml</option>
                          <option value="l">l</option>
                          <option value="opak.">opak.</option>
                          <option value="pęczek">pęczek</option>
                        </select>
                        <button
                          type="button"
                          onClick={toggleInStore}
                          className={`flex-1 py-2 px-3 rounded-xl border text-xs font-bold flex items-center justify-center gap-1.5 transition-all active:scale-95 ${
                            household.inStoreBy === activeProfile
                              ? 'bg-emerald-600 border-emerald-600 text-white'
                              : 'bg-slate-50 border-slate-200 text-slate-700'
                          }`}
                        >
                          <Icon name="store" className="w-4 h-4 shrink-0" />
                          <span>{household.inStoreBy === activeProfile ? 'W sklepie ✓' : 'Jestem w sklepie'}</span>
                        </button>
                      </div>
                    </form>

                    {/* Lista zakupów pogrupowana kategoriami */}
                    {shoppingItems.length === 0 ? (
                      <div className="bg-white rounded-3xl p-8 text-center border border-slate-200/70">
                        <p className="text-4xl mb-2">🛒</p>
                        <p className="text-sm font-bold text-slate-800">Lista zakupów jest pusta</p>
                        <p className="text-xs text-slate-500 mt-1">
                          Dopisz produkty wyżej albo wrzuć składniki z Planera tygodnia!
                        </p>
                      </div>
                    ) : (
                      <div className="space-y-3">
                        {groupedShopping.map((group) => (
                          <div
                            key={group.id}
                            className="bg-white rounded-3xl p-3.5 shadow-sm border border-slate-200/70 space-y-2"
                          >
                            <h3 className="text-[11px] font-extrabold uppercase tracking-wider text-slate-400 px-1 flex items-center gap-1.5">
                              <span>{group.emoji}</span>
                              <span>{group.label}</span>
                            </h3>
                            <div className="divide-y divide-slate-100">
                              {group.items.map((item) => (
                                <div key={item.id} className="py-2 flex items-center justify-between gap-2">
                                  <button
                                    onClick={() => toggleShoppingItem(item)}
                                    className="flex items-center gap-3 flex-1 min-w-0 text-left"
                                  >
                                    <span className="w-6 h-6 rounded-xl border-2 border-slate-300 flex items-center justify-center shrink-0" />
                                    <span className="text-sm font-semibold text-slate-800 truncate">
                                      {item.name}
                                    </span>
                                  </button>
                                  <div className="flex items-center gap-1.5 shrink-0">
                                    <span className="text-xs font-bold text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded-lg">
                                      {formatAmount(item.amount)} {item.unit}
                                    </span>
                                    <button
                                      onClick={() => deleteShoppingItem(item)}
                                      className="p-1.5 text-slate-300 hover:text-rose-500"
                                      aria-label="Usuń produkt"
                                    >
                                      <Icon name="trash" className="w-4 h-4" />
                                    </button>
                                  </div>
                                </div>
                              ))}
                            </div>
                          </div>
                        ))}

                        {/* Sekcja kupionych produktów */}
                        {checkedShopping.length > 0 && (
                          <div className="bg-emerald-50/60 rounded-3xl p-3.5 border border-emerald-200/80 space-y-2.5">
                            <div className="flex items-center justify-between gap-2">
                              <span className="text-xs font-extrabold text-emerald-800">
                                W koszyku ({checkedShopping.length})
                              </span>
                              <button
                                onClick={clearCheckedToFridge}
                                className="px-3 py-1.5 bg-emerald-600 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm active:scale-95"
                              >
                                <Icon name="snowflake" className="w-3.5 h-3.5" />
                                Przenieś do Lodówki
                              </button>
                            </div>
                            <div className="space-y-1">
                              {checkedShopping.map((item) => (
                                <div key={item.id} className="py-1.5 flex items-center justify-between gap-2">
                                  <button
                                    onClick={() => toggleShoppingItem(item)}
                                    className="flex items-center gap-2.5 flex-1 min-w-0 text-left opacity-70"
                                  >
                                    <span className="w-5 h-5 rounded-lg bg-emerald-500 text-white flex items-center justify-center shrink-0">

                      </div>

                ) : (
                  /* PODZAKŁADKA: LODÓWKA */
                  <div className="space-y-3">
                    <form
                      onSubmit={handleQuickAddFridge}
                      className="bg-white rounded-3xl p-3.5 shadow-sm border border-slate-200/70 space-y-2.5"
                    >
                      <div className="flex gap-2">
                        <input
                          type="text"
                          value={newFridgeName}
                          onChange={(e) => setNewFridgeName(e.target.value)}
                          placeholder="Co macie w lodówce / szafce?"
                          className="flex-1 bg-slate-50 border border-slate-200 rounded-2xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-sky-500"
                        />
                        <button
                          type="submit"
                          className="w-11 h-11 bg-sky-600 hover:bg-sky-700 text-white rounded-2xl flex items-center justify-center shadow-sm active:scale-95 shrink-0"
                          aria-label="Dodaj do lodówki"

                      <div className="flex items-center gap-2">
                        <input

                          inputMode="decimal"
                          value={newFridgeAmount}

                          value={newFridgeUnit}

                        </select>
                        <p className="text-[11px] text-slate-400 flex-1 leading-tight">

                    {fridgeItems.length === 0 ? (

                </div>

                <div className="p-4 overflow-y-auto space-y-4 flex-1">
                  {selectedRecipe.screenshotUrl && (
                    <div className="space-y-1.5">
                      <div className="flex items-center justify-between">
                        <span className="text-[11px] font-extrabold uppercase tracking-wider text-slate-400">

                  {selectedRecipe.note && (
                    <p className="text-xs text-indigo-800 bg-indigo-50 rounded-2xl p-3">

                    </p>

                  {/* Przelicznik porcji */}
                  <div className="flex items-center justify-between bg-slate-50 border border-slate-200 rounded-2xl p-3">
                    <span className="text-xs font-bold text-slate-700">Przelicz porcje:</span>
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => setPortionMultiplier((m) => Math.max(0.5, Math.round((m - 0.5) * 10) / 10))}

                      </span>
                      <button
                        onClick={() => setPortionMultiplier((m) => Math.min(6, Math.round((m + 0.5) * 10) / 10))}
                        className="w-7 h-7 rounded-xl bg-white border border-slate-200 flex items-center justify-center"
                      >
                        <Icon name="plus" className="w-3.5 h-3.5" />
                      </button>
                    </div>
                  </div>

                  {/* Składniki */}
                  <div>
                    <h4 className="text-xs font-extrabold uppercase tracking-wider text-slate-400 mb-2">
                      Składniki
                    </h4>
                    <div className="bg-slate-50 rounded-2xl p-3 divide-y divide-slate-200/70">
                      {(selectedRecipe.ingredients || []).map((ing, i) => (
                        <div key={i} className="py-2 flex items-center justify-between gap-2 text-sm">
                          <span className="text-slate-800 font-medium">{ing.name}</span>
                          <span className="font-bold text-indigo-700 shrink-0">
                            {formatAmount((parseSafeNumber(ing.amount, 1) || 1) * portionMultiplier)} {ing.unit}
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Kroki */}
                  <div>
                    <h4 className="text-xs font-extrabold uppercase tracking-wider text-slate-400 mb-2">
                      Przygotowanie (kliknij aby odhaczyć)
                    </h4>
                    <div className="space-y-2">
                      {(selectedRecipe.steps || []).map((step, i) => {
                        const done = !!checkedSteps[i];
                        return (
                          <button
                            key={i}
                            onClick={() => setCheckedSteps((prev) => ({ ...prev, [i]: !prev[i] }))}
                            className={`w-full p-3 rounded-2xl border text-left flex items-start gap-3 transition-all ${
                              done ? 'bg-emerald-50 border-emerald-200 opacity-65' : 'bg-white border-slate-200'
                            }`}
                          >
                            <span
                              className={`w-6 h-6 rounded-full text-xs font-bold flex items-center justify-center shrink-0 mt-0.5 ${
                                done ? 'bg-emerald-500 text-white' : 'bg-indigo-100 text-indigo-700'
                              }`}
                            >
                              {done ? '✓' : i + 1}
                            </span>
                            <span className={`text-sm leading-relaxed ${done ? 'line-through text-slate-500' : 'text-slate-800'}`}>
          {importModalMode && (
            <RecipeImportModal
              initialMode={importModalMode}
              geminiApiKey={geminiApiKey}
              fridgeItems={fridgeItems}
              onSave={saveNewRecipe}
              onSaveGeminiKey={(k) => {
                setGeminiApiKey(k);
                showToast('Zapisano klucz AI ✨');
              }}
              onOpenSettings={() => {
                setImportModalMode(null);
                setShowSettingsModal(true);
              }}
              onClose={() => setImportModalMode(null)}
            />
          )}

          {zoomedScreenshot && (
            <div
              onClick={() => setZoomedScreenshot(null)}
              className="fixed inset-0 z-[90] bg-black/90 flex flex-col items-center justify-center p-4"
            >
              <button
                type="button"
                onClick={() => setZoomedScreenshot(null)}
                className="self-end mb-3 px-3.5 py-2 bg-white/15 text-white rounded-2xl text-xs font-bold flex items-center gap-1.5"
              >
                <Icon name="x" className="w-4 h-4" />
                Zamknij
              </button>
              <img
                src={zoomedScreenshot}
                alt="Powiększony przepis"
                className="max-w-full max-h-[82vh] object-contain rounded-2xl"
              />
            </div>
          )}

          {/* ==================================================================
              MODAL: POTWIERDZENIE SKŁADNIKÓW NA ZAKUPY (Z ODLICZENIEM LODÓWKI)
             ================================================================== */}
          {addToCartModal && (
            <div className="fixed inset-0 z-[70] bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-white w-full max-w-lg max-h-[88vh] rounded-t-3xl sm:rounded-3xl overflow-hidden flex flex-col shadow-2xl">
                <div className="p-4 border-b border-slate-100 flex items-center justify-between gap-2">
                  <div>
                    <h3 className="font-bold text-base text-slate-900">Wrzuć na listę zakupów</h3>
                    <p className="text-xs text-slate-500">{addToCartModal.recipeTitle}</p>
                  </div>
                  <button
                    onClick={() => setAddToCartModal(null)}
                    className="p-2 bg-slate-100 rounded-xl text-slate-500"
                  >
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                <div className="p-4 overflow-y-auto space-y-2 flex-1">
                  {addToCartModal.items.map((ing, i) => (
                    <button
                      key={i}
                      onClick={() =>
                        setAddToCartModal((prev) => ({
                          ...prev,
                          items: prev.items.map((it, idx) => (idx === i ? { ...it, selected: !it.selected } : it))
                        }))
                      }
                      className={`w-full p-3 rounded-2xl border flex items-center justify-between gap-2 text-left ${
                        ing.selected ? 'bg-indigo-50/60 border-indigo-200' : 'bg-slate-50 border-slate-200 opacity-65'
                      }`}
                    >
                      <div className="flex items-center gap-2.5 min-w-0">
                        <span
                          className={`w-5 h-5 rounded-lg flex items-center justify-center shrink-0 ${
                            ing.selected ? 'bg-indigo-600 text-white' : 'border-2 border-slate-300 bg-white'
                          }`}
                        >
                          {ing.selected && <Icon name="check" className="w-3.5 h-3.5" />}
                        </span>
                        <div className="min-w-0">
                          <span className="text-sm font-semibold text-slate-800">{ing.name}</span>
                          {ing.days && ing.days.length > 0 && (
                            <span className="ml-1.5 text-[10px] font-bold text-indigo-700 bg-indigo-100 px-1.5 py-0.5 rounded">
                              {ing.days.join(', ')}
                            </span>
                          )}
                          {ing.inFridge && (
                            <span className="ml-1.5 text-[10px] font-bold text-sky-700 bg-sky-100 px-1.5 py-0.5 rounded">
                              ❄️ masz: {formatAmount(ing.inFridge.amount)} {ing.inFridge.unit}
                            </span>
                          )}
                          {ing.isPantry && (
                            <span className="ml-1.5 text-[10px] font-bold text-slate-500 bg-slate-200/70 px-1.5 py-0.5 rounded">
                              przyprawa
                            </span>
                          )}
                        </div>
                      </div>
                      <span className="text-xs font-extrabold text-slate-700 shrink-0">
                        {formatAmount(ing.scaledAmount)} {ing.unit}
                      </span>
                    </button>
                  ))}
                </div>

                <div className="p-4 border-t border-slate-100 safe-bottom">
                  <button
                    onClick={confirmAddIngredientsToCart}
                    className="w-full py-3 bg-indigo-600 text-white rounded-2xl text-sm font-bold shadow-sm"
                  >
                    Dodaj zaznaczone ({addToCartModal.items.filter((i) => i.selected).length})
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODALE POMOCNICZE */}
          {showAddChoreModal && (
            <AddChoreModal
              onClose={() => setShowAddChoreModal(false)}
              onAdd={handleAddChore}
            />
          )}

          {showMatchModal && (
            <TinderMatchModal
              recipes={recipes}
              activeProfile={activeProfile}
              user1Name={household.user1Name}
              user2Name={household.user2Name}
              onVote={voteRecipe}
              onReset={resetAllVotes}
              onSchedule={(r) => {
                setShowMatchModal(false);
                setScheduleRecipeModal(r);
              }}
              onClose={() => setShowMatchModal(false)}
            />
          )}

          {showImportModal && (
            <RecipeImportModal
              geminiApiKey={geminiApiKey}
              fridgeItems={fridgeItems}
              onSave={saveNewRecipe}
              onOpenSettings={() => {
                setShowImportModal(false);
                setShowSettingsModal(true);
              }}
              onClose={() => setShowImportModal(false)}
            />
          )}

          {plannerPickerTarget && (
            <MealPlannerPickerModal
              target={plannerPickerTarget}
              recipes={recipes}
              onSelect={async (recipeOrCustom, servingsCount) => {
                await assignMealToSlot(plannerPickerTarget.dayId, plannerPickerTarget.slotId, recipeOrCustom, servingsCount);
                setPlannerPickerTarget(null);
              }}
              onClose={() => setPlannerPickerTarget(null)}
            />
          )}

          {scheduleRecipeModal && (
            <ScheduleRecipeDayModal
              recipe={scheduleRecipeModal}
              mealPlan={mealPlan}
              todayJsDay={todayJsDay}
              onAssign={async (dayId, slotId, servingsCount) => {
                await assignMealToSlot(dayId, slotId, scheduleRecipeModal, servingsCount);
                setScheduleRecipeModal(null);
              }}
              onClose={() => setScheduleRecipeModal(null)}
            />
          )}

          {showSettingsModal && (
            <SettingsModal
              household={household}
              houseCode={houseCode}
              activeProfile={activeProfile}
              fbConfig={fbConfig}
              syncStatus={syncStatus}
              geminiApiKey={geminiApiKey}
              onUpdateHousehold={updateHouseholdField}
              onChangeHouseCode={(code) => {
                setHouseCode(code);
                showToast('Zapisano kod domu 🏡');
              }}
              onChangeProfile={setActiveProfile}
              onChangeGeminiKey={(k) => {
                setGeminiApiKey(k);
                showToast('Zapisano klucz AI ✨');
              }}
              onShowToast={showToast}
              onClose={() => setShowSettingsModal(false)}
            />
          )}
        </div>
      );
    }

    // ============================================================================
    // MODAL: DODAWANIE PRZEPISU (ZRZUT EKRANU 1-KLIK + WŁASNY + IMPORT AI)
    // ============================================================================
    function RecipeImportModal({ initialMode = 'manual', geminiApiKey, fridgeItems, onSave, onSaveGeminiKey, onOpenSettings, onClose }) {
      const [mode, setMode] = useState(initialMode); // image | manual | text | ai
      const [loading, setLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      // Formularz własny
      const [title, setTitle] = useState('');
      const [emoji, setEmoji] = useState('🍽️');
      const [prepTime, setPrepTime] = useState('25');
      const [servings, setServings] = useState('2');
      const [tags, setTags] = useState(['klasyki']);
      const [ingredients, setIngredients] = useState([{ name: '', amount: '1', unit: 'szt.' }]);
      const [stepsText, setStepsText] = useState('');

      // Zrzut ekranu i AI inputy
      const [imagePreview, setImagePreview] = useState('');
      const [imageBase64, setImageBase64] = useState('');
      const [imageMime, setImageMime] = useState('image/jpeg');
      const [storageScreenshotUrl, setStorageScreenshotUrl] = useState('');
      const [quickShotTitle, setQuickShotTitle] = useState('');
      const [quickShotTag, setQuickShotTag] = useState('klasyki');
      const [inlineKeyInput, setInlineKeyInput] = useState('');
      const [rawText, setRawText] = useState('');
      const [aiPrompt, setAiPrompt] = useState('');

      const toggleTag = (tagId) => {
        setTags((prev) => (prev.includes(tagId) ? prev.filter((t) => t !== tagId) : [...prev, tagId]));
      };

      const handleFile = async (e) => {
        const f = e.target.files?.[0];
        if (!f) return;
        setErrorMsg('');
        try {
          const [forAi, forStorage] = await Promise.all([
            compressImageFile(f, 1200, 0.8),
            compressImageFile(f, 750, 0.62)
          ]);
          setImagePreview(forAi.dataUrl);
          setImageBase64(forAi.base64);
          setImageMime(forAi.mime);
          setStorageScreenshotUrl(forStorage.dataUrl);
        } catch (err) {
          setErrorMsg(err.message);
        }
      };

      const handleSaveScreenshotDirectly = async () => {
        setErrorMsg('');
        if (!storageScreenshotUrl) {
          setErrorMsg('Najpierw wybierz zrzut ekranu z galerii iPhone’a.');
          return;
        }
        const finalTitle = quickShotTitle.trim() || `Przepis ze zrzutu (${new Date().toLocaleDateString('pl-PL')})`;
        await onSave({
          title: finalTitle,
          emoji: '📸',
          prepTime: 25,
          servings: 2,
          tags: [quickShotTag || 'klasyki'],
          source: 'Zrzut ekranu',
          screenshotUrl: storageScreenshotUrl,
          note: 'Kliknij zdjęcie powyżej, aby powiększyć przepis na cały ekran podczas gotowania.',
          ingredients: [],
          steps: ['Otwórz powiększony zrzut ekranu powyżej i przygotuj danie krok po kroku.']
        });
      };

      const handleSaveManual = async (e) => {
        e.preventDefault();
        setErrorMsg('');
        if (!title.trim()) { setErrorMsg('Podaj nazwę dania.'); return; }
        const parsedIngs = ingredients
          .filter((i) => i.name.trim())
          .map((i) => ({
            name: i.name.trim(),
            amount: parseSafeNumber(i.amount, 1) || 1,
            unit: i.unit.trim() || 'szt.',
            category: guessShoppingCategory(i.name),
            isPantry: /(sól|pieprz|olej|oliw|przypraw|cukier|woda)/i.test(i.name)
          }));
        if (parsedIngs.length === 0 && !storageScreenshotUrl) {
          setErrorMsg('Dodaj przynajmniej jeden składnik.');
          return;
        }
        const steps = stepsText.split('\n').map((s) => s.trim()).filter(Boolean);
        await onSave({
          title: title.trim(),
          emoji: emoji || '🍽️',
          prepTime: Math.max(1, parseInt(prepTime, 10) || 25),
          servings: Math.max(1, parseInt(servings, 10) || 2),
          tags: tags.length > 0 ? tags : ['klasyki'],
          source: storageScreenshotUrl ? 'Zrzut ekranu + AI' : 'Własny przepis',
          screenshotUrl: storageScreenshotUrl || '',
          ingredients: parsedIngs,
          steps: steps.length > 0 ? steps : ['Przygotuj składniki i ugotuj danie.']
        });
      };

      const runAI = async (overrideKey = null) => {
        setErrorMsg('');
        const activeKey = (overrideKey !== null ? overrideKey : geminiApiKey).trim();
        if (!activeKey) {
          setErrorMsg('Wklej poniżej swój darmowy klucz Google AI Studio (albo zapisz sam zrzut bez AI).');
          return;
        }
        if (mode === 'image' && !imageBase64) { setErrorMsg('Najpierw wybierz zrzut ekranu z galerii.'); return; }
        if (mode === 'text' && !rawText.trim()) { setErrorMsg('Wklej tekst przepisu.'); return; }

        setLoading(true);
        try {
          const sys = 'Jesteś polskim asystentem kulinarnym. Odczytuj lub twórz sprawdzone polskie przepisy domowe. Zwróć WYŁĄCZNIE poprawny obiekt JSON zgodny ze schematem.';
          const parts = [];
          if (mode === 'image') {
            parts.push({ text: 'Odczytaj dokładnie cały przepis ze zdjęcia (zrzutu ekranu z Instagrama, TikToka lub strony jak Ania Gotuje). Podaj tytuł, emoji, czas, porcje, pasujące tagi z dozwolonej listy, wszystkie składniki z ilościami oraz jasne kroki przygotowania po polsku.' });
            parts.push({ inlineData: { mimeType: imageMime, data: imageBase64 } });
          } else if (mode === 'text') {
            parts.push({ text: `Zamień poniższy opis w uporządkowany polski przepis:\n\n${rawText.trim()}` });
          } else {
            const fridgeList = fridgeItems.map((f) => f.name).join(', ');
            parts.push({
              text: `Wymyśl pyszny domowy posiłek dla 2 osób po polsku. ${
                aiPrompt.trim() ? `Wykorzystaj: ${aiPrompt.trim()}.` : fridgeList ? `Mamy w lodówce: ${fridgeList}.` : 'Zaproponuj coś pysznego i prostego.'
              }`
            });
          }

          const payload = {
            systemInstruction: { parts: [{ text: sys }] },
            contents: [{ role: 'user', parts }],
            generationConfig: {
              responseMimeType: 'application/json',
              responseSchema: {
                type: 'OBJECT',
                properties: {
                  title: { type: 'STRING' },
                  emoji: { type: 'STRING' },
                  prepTime: { type: 'NUMBER' },
                  servings: { type: 'NUMBER' },
                  tags: { type: 'ARRAY', items: { type: 'STRING' } },
                  note: { type: 'STRING' },
                  ingredients: {
                    type: 'ARRAY',
                    items: {
                      type: 'OBJECT',
                      properties: {
                        name: { type: 'STRING' },
                        amount: { type: 'NUMBER' },
                        unit: { type: 'STRING' },
                        isPantry: { type: 'BOOLEAN' }
                      },
                      required: ['name', 'amount', 'unit']
                    }
                  },
                  steps: { type: 'ARRAY', items: { type: 'STRING' } }
                },
                required: ['title', 'ingredients', 'steps']
              }
            }
          };

          const data = await fetchGeminiWithBackoff(activeKey, payload);
          const txt = data?.candidates?.[0]?.content?.parts?.map((p) => p.text || '').join('') || '';
          const first = txt.indexOf('{');
          const last = txt.lastIndexOf('}');
          const parsed = JSON.parse(txt.slice(first, last + 1));

          const validTagIds = new Set(RECIPE_TAGS.map((t) => t.id));
          const cleanTags = (parsed.tags || []).filter((t) => validTagIds.has(t));

          setTitle(parsed.title || quickShotTitle || 'Nowy przepis');
          setEmoji(parsed.emoji || '🍽️');
          setPrepTime(String(parsed.prepTime || 25));
          setServings(String(parsed.servings || 2));
          setTags(cleanTags.length ? cleanTags : [quickShotTag || 'klasyki']);
          setIngredients(
            (parsed.ingredients || []).map((i) => ({
              name: i.name || '',
              amount: String(i.amount || 1),
              unit: i.unit || 'szt.'
            }))
          );
          setStepsText((parsed.steps || []).join('\n'));
          setMode('manual');
        } catch (err) {
          setErrorMsg(err.message || 'Nie udało się odczytać przepisu z tego źródła.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="fixed inset-0 z-[60] bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div className="bg-white w-full max-w-lg max-h-[92vh] rounded-t-3xl sm:rounded-3xl overflow-hidden flex flex-col shadow-2xl">
            <div className="p-4 border-b border-slate-100 flex items-center justify-between">
              <h3 className="font-bold text-base text-slate-900">Dodaj przepis</h3>
              <button onClick={onClose} className="p-2 bg-slate-100 rounded-xl text-slate-500">
                <Icon name="x" className="w-4 h-4" />
              </button>
            </div>

            <div className="px-4 pt-3 flex gap-1.5 overflow-x-auto no-scrollbar">
              {[
                { id: 'image', label: '📸 Zrzut ekranu' },
                { id: 'manual', label: '✏️ Własne' },
                { id: 'text', label: '📝 Z tekstu' },
                { id: 'ai', label: '✨ Pomysł AI' }
              ].map((m) => (
                <button
                  key={m.id}
                  onClick={() => { setMode(m.id); setErrorMsg(''); }}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${
                    mode === m.id ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'
                  }`}
                >
                  {m.label}
                </button>
              ))}
            </div>

            <div className="p-4 overflow-y-auto flex-1 space-y-3">
              {errorMsg && (
                <div className="p-3 bg-rose-50 border border-rose-200 rounded-2xl text-xs text-rose-700">
                  {errorMsg}
                </div>
              )}

              {mode === 'manual' ? (
                <form id="manual-recipe-form" onSubmit={handleSaveManual} className="space-y-3">
                  {storageScreenshotUrl && (
                    <div className="p-2 bg-emerald-50 border border-emerald-200 rounded-2xl flex items-center gap-2.5">
                      <img src={storageScreenshotUrl} alt="Miniatura" className="w-12 h-12 object-cover rounded-xl shrink-0" />
                      <p className="text-xs font-semibold text-emerald-800">
                        ✅ Zrzut ekranu odczytany! Sprawdź dane niżej i kliknij „Zapisz przepis”.
                      </p>
                    </div>
                  )}

                  <div className="flex gap-2">
                    <input
                      type="text"
                      value={emoji}
                      onChange={(e) => setEmoji(e.target.value)}
                      className="w-14 bg-slate-50 border border-slate-200 rounded-2xl text-center py-2"
                    />
                    <input
                      type="text"
                      value={title}
                      onChange={(e) => setTitle(e.target.value)}
                      placeholder="Nazwa dania (np. Makaron z pesto)"
                      className="flex-1 bg-slate-50 border border-slate-200 rounded-2xl px-3.5 py-2"
                      required
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <input
                      type="number"
                      value={prepTime}
