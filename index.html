    function guessShoppingCategory(name) {
      const n = (name || '').toLowerCase().trim();
      if (/(papier|mydło|mydlo|płyn|plyn|kapsułk|kapsulk|proszek|worki|ręcznik|recznik|pasta do zębów|szampon|gąbk|gabk|ścierecz|scierecz|tabletki do zmyw|odświeżacz|wybielacz|domestos|cif|ludwik|do szyb)/.test(n)) return 'chemia';
      if (/(sól|sol|pieprz|oliw|olej|sos|passat|ketchup|musztard|majonez|przypraw|curry|oregano|cukier|mleczko kokos|suszon|granulowan|mielon[aey]|wędzon[aey]|słodk[aey]\s+papryk|ostr[aey]\s+papryk|papryka\s+(słodka|slodka|ostra|wędzona|wedzona)|cynamon|kurkum|imbir\s+mielon|kumin|kminek|majeranek|tymianek|rozmaryn|bazylia\s+suszon|liść laurowy|lisc laurowy|ziele angielskie|proszek do pieczenia|soda oczyszczona|wanili|ocet|pesto|bulion|kostk[ai]\s+rosołow|zakwas|chrzan|koncentrat|w puszce|w słoiku|tahini|kakao)/.test(n)) return 'przyprawy';
      if (/(makaron|ryż|ryz|kasza|mąka|maka|płatki|platki|ciecierzyc|fasol|gnocchi|soczewic|bułka tarta|bulka tarta|sezam|pestki|orzech|migdał|rodzynk|drożdż|drozdz|kukurydza konserw|groszek konserw|lasagne|cannelloni|udon|uszka)/.test(n)) return 'sypkie';
      if (/(mleko|ser\b|serek|parmezan|mozzarell|feta|cheddar|jogurt|śmietan|smietan|masło|maslo|jajk|twaróg|twarog|kefir|maślank|maslank|ricotta|mascarpone|burrata)/.test(n)) return 'nabial';
      if (/(kurczak|indyk|mięso|mieso|schab|wołow|wolow|wieprz|szynk|boczek|kiełbas|kielbas|łosoś|losos|tuńczyk|tunczyk|ryba|krewet|filet|pierś|piers|karkówk|karkowk|polędwic|poledwic|dorsz|makrela|żeberk|zeberk|łopatka|lopatka)/.test(n)) return 'mieso';
      if (/(chleb|bułk|bulk|tortill|bagiet|pieczyw|tost|chałk|chalk|kajzerk|rogale|ciabatta|ciasto francuskie)/.test(n)) return 'pieczywo';
      if (/(pomidor|ogórek|ogorek|cebula|czosnek|szpinak|sałat|salat|marchew|ziemniak|cukini|papryk|jabłk|jablk|banan|cytryn|koperek|bazyl|brokuł|brokul|pieczark|awokado|owoc|warzyw|rzodkiew|szczypior|natka|pietruszk|seler|por\b|dynia|borówk|borowk|malin|truskawk|gruszk|pomarańcz|pomarancz|włoszczyzn|wloszczyzn|szparag|kalafior|groszek|burak|batat|mango|kiwi|limonk|śliwk|sliwk|rukola|kapusta)/.test(n)) return 'warzywa';
      return 'inne';
    }

    function guessStorageLocation(name, category) {
      const cat = category || guessShoppingCategory(name);
      if (cat === 'chemia') return 'none';
      if (cat === 'nabial' || cat === 'mieso') return 'fridge';
      if (cat === 'sypkie' || cat === 'przyprawy' || cat === 'pieczywo') return 'pantry';
      const n = (name || '').toLowerCase();
      if (/(puszk|słoik|sloik|konserw|such|makaron|ryż|kasza|mąka|olej|oliw|cukier|kawa|herbata|płatki|przypraw|miód|miod|dżem|dzem|masło orzech|syrop|ketchup|musztard|sos soj|passat|mleczko kokos)/.test(n)) {
        return 'pantry';
      }
      if (cat === 'warzywa') return 'fridge';
      return 'pantry';
    }

    function parseSafeNumber(val, fallback = 1) {
      if (typeof val === 'number' && !Number.isNaN(val)) return val;
      const n = parseFloat(String(val || '').replace(',', '.'));
      return Number.isNaN(n) ? fallback : n;
    }

    function formatAmount(num) {
      const n = Math.round(parseSafeNumber(num, 1) * 10) / 10;
      return Number.isInteger(n) ? String(n) : String(n).replace('.', ',');
    }

    function formatMealCount(n) {
      if (n === 1) return '1 posiłek';
      const mod10 = n % 10;
      const mod100 = n % 100;
      if (mod10 >= 2 && mod10 <= 4 && !(mod100 >= 12 && mod100 <= 14)) return `${n} posiłki`;
      return `${n} posiłków`;
    }

    function getDayMeals(plan, dayId) {
      const raw = plan?.[dayId];
      if (!raw || typeof raw !== 'object') return {};
      if (raw.recipeId || raw.title) {
        return { lunch: raw };
      }
      return {
        breakfast: raw.breakfast || null,
        lunch: raw.lunch || null,
        dinner: raw.dinner || null
      };
    }

    function encodeSetupPayload(obj) {
      const json = JSON.stringify(obj);
      const bytes = new TextEncoder().encode(json);
      let bin = '';
      bytes.forEach((b) => { bin += String.fromCharCode(b); });
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function decodeSetupPayload(str) {
      let b64 = String(str || '').replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      const bin = atob(b64);
      const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(bytes));
    }

    function parseFirebaseConfigInput(raw) {
      if (!raw || typeof raw !== 'string') return null;
      const keys = ['apiKey', 'authDomain', 'projectId', 'storageBucket', 'messagingSenderId', 'appId'];
      const out = {};
      for (const k of keys) {
        const re = new RegExp(`["']?${k}["']?\\s*:\\s*["']([^"']+)["']`);
        const m = raw.match(re);
        if (m && m[1]) out[k] = m[1].trim();
      }
      if (!out.apiKey || !out.projectId) return null;
      return out;
    }

    function compressImageFile(file, maxDim = 1200, quality = 0.8) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Nie udało się odczytać zdjęcia.'));
        reader.onload = (ev) => {
          const img = new Image();
          img.onerror = () => reject(new Error('Niepoprawny plik graficzny.'));
          img.onload = () => {
            let w = img.width;
            let h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
              else { w = Math.round((w * maxDim) / h); h = maxDim; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            resolve({ dataUrl, base64: dataUrl.split(',')[1], mime: 'image/jpeg' });
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function fetchGeminiWithBackoff(apiKey, payload, maxRetries = 3) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${encodeURIComponent(apiKey || '')}`;
      let delay = 1000;
      for (let attempt = 0; attempt <= maxRetries; attempt++) {
        try {
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (res.ok) return await res.json();
          if (res.status === 429 || res.status >= 500) {
            if (attempt < maxRetries) {
              await new Promise((r) => setTimeout(r, delay));
              delay *= 2;
              continue;
            }
          }
          const errJson = await res.json().catch(() => ({}));
          throw new Error(errJson?.error?.message || `Błąd API Gemini (${res.status}) — sprawdź klucz w Ustawieniach.`);
        } catch (err) {
          if (attempt < maxRetries && !String(err.message || '').includes('Błąd API Gemini')) {
            await new Promise((r) => setTimeout(r, delay));
            delay *= 2;
            continue;
          }
          throw err;
        }
      }
      throw new Error('Przekroczono limit prób połączenia z AI.');
    }

    function isChoreDue(chore) {
      if (!chore.lastDoneAt) return true;
      if (chore.frequency === 'jednorazowe') return false;
      const days = FREQUENCY_DAYS[chore.frequency] || 1;
      const diffHours = (Date.now() - chore.lastDoneAt) / (1000 * 60 * 60);
      return diffHours >= days * 20;
    }

    function bootstrapInitialSettings() {
      try {
        const hash = window.location.hash || '';
        const lastApplied = localStorage.getItem('naszdom_last_hash');
        if (hash.startsWith('#setup=') && hash !== lastApplied) {
          const payload = decodeSetupPayload(hash.slice(7));
          if (payload.firebaseConfig) {
            localStorage.setItem('naszdom_fb_config', JSON.stringify(payload.firebaseConfig));
          }
          if (payload.houseCode) {
            localStorage.setItem('naszdom_house_code', payload.houseCode);
          }
          if (payload.profile === 'user1' || payload.profile === 'user2') {
            localStorage.setItem('naszdom_profile', payload.profile);
          }
          if (payload.geminiKey) {
            localStorage.setItem('naszdom_gemini_key', payload.geminiKey);
          }
          localStorage.setItem('naszdom_last_hash', hash);
        }
      } catch (err) {
        console.warn('Nie udało się odczytać linku startowego:', err);
      }

      let fbConfig = DEFAULT_FIREBASE_CONFIG;
      try {
        const saved = localStorage.getItem('naszdom_fb_config');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && parsed.apiKey && parsed.projectId) {
            fbConfig = parsed;
          }
        }
      } catch (_) {}

      return {
        fbConfig,
        houseCode: localStorage.getItem('naszdom_house_code') || 'nasz-dom-2026',
        profile: localStorage.getItem('naszdom_profile') || 'user1',
        geminiKey: localStorage.getItem('naszdom_gemini_key') || ''
      };
    }

          if (prev.some((n) => n.id === notif.id)) return prev;
          return [notif, ...prev].slice(0, 6);
        });
      };

      const dismissNotification = (id) => {
        setDismissedNotifIds((prev) => ({ ...prev, [id]: true }));
        setStartupNotifications((prev) => prev.filter((n) => n.id !== id));
      };

      // Toast
      const [toast, setToast] = useState(null);
      const toastTimer = useRef(null);
      const showToast = (msg, type = 'success') => {
        setToast({ msg, type });
        if (toastTimer.current) clearTimeout(toastTimer.current);
        toastTimer.current = setTimeout(() => setToast(null), 3200);
      };

      const defaultHousehold = {
        user1Name: 'Kuba',
        user2Name: 'Ania',
        user1Points: 0,
        user2Points: 0,
        nudge: null,
        mealPlan: {},
        starterVotes: {},
        choresSeeded: true
      };

      const loadLocal = (key, fallback) => {
        try {
          const v = localStorage.getItem(`naszdom_data_${cleanHouseId}_${key}`);
          return v ? JSON.parse(v) : fallback;
        } catch (_) { return fallback; }
      };

      const [household, setHousehold] = useState(() => loadLocal('household', defaultHousehold));
      const householdRef = useRef(household);
      useEffect(() => { householdRef.current = household; }, [household]);

      const [shoppingItems, setShoppingItems] = useState(() => loadLocal('shopping', []));
      const [fridgeItems, setFridgeItems] = useState(() => loadLocal('fridge', []));
      const [chores, setChores] = useState(() =>
        loadLocal('chores', []).filter((c) => !NORMALIZED_LEGACY_CHORES.has(normalizeTitle(c.title)))
      );
      const [customRecipes, setCustomRecipes] = useState(() => loadLocal('recipes', []));

      // Bezpieczna obsługa zmiany kodu domu (wczytanie świeżego stanu zamiast mieszania dwóch domów)
      const prevHouseIdRef = useRef(cleanHouseId);
      useEffect(() => {
        if (prevHouseIdRef.current !== cleanHouseId) {
          prevHouseIdRef.current = cleanHouseId;
          setHousehold(loadLocal('household', defaultHousehold));
          setShoppingItems(loadLocal('shopping', []));
          setFridgeItems(loadLocal('fridge', []));
          setChores(
            loadLocal('chores', []).filter((c) => !NORMALIZED_LEGACY_CHORES.has(normalizeTitle(c.title)))
          );
          setCustomRecipes(loadLocal('recipes', []));
          setSelectedRecipeId(null);
        }
      }, [cleanHouseId]);

      // Scalone przepisy (startowe + własne + głosy Tinder)
      const recipes = useMemo(() => {
        const starterVotes = household.starterVotes || {};
        const mergedStarters = STARTER_RECIPES.map((r) => ({
          ...r,
          votes: starterVotes[r.id] || {}
        }));
        return [...customRecipes, ...mergedStarters];
      }, [customRecipes, household.starterVotes]);

      // Zapis lokalny (tryb offline / przed podpięciem Firebase)
      useEffect(() => {
        if (fbConfig) return;
        try {
          localStorage.setItem(`naszdom_data_${cleanHouseId}_household`, JSON.stringify(household));
          localStorage.setItem(`naszdom_data_${cleanHouseId}_shopping`, JSON.stringify(shoppingItems));
          localStorage.setItem(`naszdom_data_${cleanHouseId}_fridge`, JSON.stringify(fridgeItems));
          localStorage.setItem(`naszdom_data_${cleanHouseId}_chores`, JSON.stringify(chores));
          localStorage.setItem(`naszdom_data_${cleanHouseId}_recipes`, JSON.stringify(customRecipes));
        } catch (_) {}
      }, [fbConfig, cleanHouseId, household, shoppingItems, fridgeItems, chores, customRecipes]);

      // Zapis preferencji profilu i kodu domu + aktualizacja #setup dla instalacji iOS PWA
      useEffect(() => {
        localStorage.setItem('naszdom_profile', activeProfile);
        localStorage.setItem('naszdom_house_code', houseCode);
        localStorage.setItem('naszdom_gemini_key', geminiApiKey);
        if (fbConfig && !window.navigator.standalone) {
          try {
            const hash = '#setup=' + encodeSetupPayload({
              firebaseConfig: fbConfig,
              houseCode: cleanHouseId,
              profile: activeProfile,
              geminiKey: geminiApiKey || ''
            });
            window.history.replaceState(null, '', hash);
            localStorage.setItem('naszdom_last_hash', hash);
          } catch (_) {}
        }
      }, [activeProfile, houseCode, cleanHouseId, geminiApiKey, fbConfig]);

      // --- UI Zakupy ---
      const [newItemName, setNewItemName] = useState('');
      const [newItemAmount, setNewItemAmount] = useState('1');
      const [newItemUnit, setNewItemUnit] = useState('szt.');
      const [storageFilter, setStorageFilter] = useState('fridge'); // fridge | pantry
      const [newFridgeName, setNewFridgeName] = useState('');
      const [newFridgeAmount, setNewFridgeAmount] = useState('1');
      const [newFridgeUnit, setNewFridgeUnit] = useState('szt.');
      const [newFridgeLocation, setNewFridgeLocation] = useState('fridge'); // fridge | pantry
      const [choresFilter, setChoresFilter] = useState('due'); // due | all
      const [showAddChoreModal, setShowAddChoreModal] = useState(false);
      const [editingChore, setEditingChore] = useState(null);

      // --- UI Przepisy i Planer ---
      const [recipeSearch, setRecipeSearch] = useState('');
      const [selectedTag, setSelectedTag] = useState('all');
      const [selectedRecipeId, setSelectedRecipeId] = useState(null);
      const [portionMultiplier, setPortionMultiplier] = useState(1);
      const [checkedSteps, setCheckedSteps] = useState({});
      const [addToCartModal, setAddToCartModal] = useState(null);
      const [importModalMode, setImportModalMode] = useState(null); // null | 'manual' | 'image' | 'text' | 'ai'
      const [showMatchModal, setShowMatchModal] = useState(false);
      const [plannerPickerTarget, setPlannerPickerTarget] = useState(null); // { dayId, slotId }
      const [scheduleRecipeModal, setScheduleRecipeModal] = useState(null);
      const [confirmClearPlan, setConfirmClearPlan] = useState(false);
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [zoomedScreenshot, setZoomedScreenshot] = useState(null);
      const selectedRecipe = useMemo(
        () => recipes.find((r) => r.id === selectedRecipeId) || null,
        [recipes, selectedRecipeId]
      );

      const colPath = (name) => `artifacts/${APP_ID}/public/data/${name}`;

      // ==========================================================================
      // POŁĄCZENIE Z FIREBASE I SYNCHRONIZACJA NA ŻYWO (2 iPHONE'Y)
      // ==========================================================================
      useEffect(() => {
        if (!fbConfig) {
          setSyncStatus('local');
          return;
        }
        let unsubAuth = null;
        try {
          setSyncStatus('connecting');
          setSyncError('');
          const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(fbConfig);
          dbRef.current = app.firestore();
          const auth = app.auth();
          unsubAuth = auth.onAuthStateChanged((user) => {
            if (user) {
              setAuthUser(user);
            } else {
              auth.signInAnonymously().catch((err) => {
                console.warn('Błąd logowania anonimowego:', err);
                setSyncStatus('error');
                setSyncError('Włącz Anonymous w Firebase → Authentication.');
              });
            }
          });
        } catch (err) {
          console.warn('Błąd inicjalizacji Firebase:', err);
          setSyncStatus('error');
          setSyncError('Niepoprawna konfiguracja Firebase.');
        }
        return () => {
          if (typeof unsubAuth === 'function') unsubAuth();
        };
      }, [fbConfig]);

      useEffect(() => {
        if (!dbRef.current || !authUser) return;
        const db = dbRef.current;
        setSyncStatus('connecting');
        setSyncError('');

        const houseDocRef = db.doc(`${colPath('households')}/${cleanHouseId}`);

        const unsubHouse = houseDocRef.onSnapshot(
          (snap) => {
            if (snap.exists) {
              const data = snap.data();
              setHousehold((prev) => ({ ...defaultHousehold, ...prev, ...data }));
            } else {
              houseDocRef
                .set({
                  ...defaultHousehold,
                  choresSeeded: true,
                  createdAt: Date.now()
                })
                .catch((e) => console.warn('Błąd tworzenia dokumentu domu:', e));
            }
            setSyncStatus('synced');
          },
          (err) => {
            console.warn('Błąd synchronizacji domu:', err);
            setSyncStatus('error');
            setSyncError('Brak dostępu do Firestore — sprawdź zakładkę Rules w Firebase.');
          }
        );

        const unsubShopping = db
          .collection(colPath('shopping'))
          .where('houseCode', '==', cleanHouseId)
          .onSnapshot(
            (snap) => {
              const items = snap.docs
                .map((d) => ({ id: d.id, ...d.data() }))
                .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
              setShoppingItems(items);

              const me = activeProfileRef.current;
              const partnerName = me === 'user1' ? householdRef.current.user2Name : householdRef.current.user1Name;
              const lastSeen = lastSeenTimestampRef.current;

              // Powiadomienie na starcie lub na żywo, gdy druga osoba dodała coś do listy zakupów
              if (!initialSnapshotDoneRef.current.shopping) {
                initialSnapshotDoneRef.current.shopping = true;
                const newByPartner = items.filter(
                  (it) => !it.checked && it.addedBy && it.addedBy !== me && (it.createdAt || 0) > lastSeen
                );
                if (newByPartner.length > 0) {
                  const namesPreview = newByPartner.slice(0, 3).map((i) => i.name).join(', ');
                  const extra = newByPartner.length > 3 ? ` (+${newByPartner.length - 3})` : '';
                  pushStartupNotification({
                    id: `shop-start-${newByPartner[0].id}`,
                    icon: '🛒',
                    color: 'indigo',
                    title: `${partnerName} dodał(a) zakupy (${newByPartner.length}):`,
                    body: `${namesPreview}${extra}`,
                    tab: 'shopping'
                  });
                }
              } else {
                snap.docChanges().forEach((change) => {
                  if (change.type === 'added') {
                    const data = change.doc.data();
                    if (data.addedBy && data.addedBy !== me && (data.createdAt || 0) > Date.now() - 60000) {
                      pushStartupNotification({
                        id: `shop-live-${change.doc.id}`,
                        icon: '🛒',
                        color: 'indigo',
                        title: `${partnerName} dopisał(a) do zakupów:`,
                        body: `${data.name} (${formatAmount(data.amount)} ${data.unit || 'szt.'})`,
                        tab: 'shopping'
                      });
                    }
                  }
                });
              }
            },
            (err) => console.warn('Błąd synchronizacji zakupów:', err)
          );

        const unsubFridge = db
          .collection(colPath('fridge'))
          .where('houseCode', '==', cleanHouseId)
          .onSnapshot(
            (snap) => {
              const items = snap.docs
                .map((d) => ({ id: d.id, ...d.data() }))
                .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
              setFridgeItems(items);
            },
            (err) => console.warn('Błąd synchronizacji lodówki:', err)
          );

        const unsubChores = db
          .collection(colPath('chores'))
          .where('houseCode', '==', cleanHouseId)
          .onSnapshot(
            async (snap) => {
              const allItems = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
              const legacyDocs = allItems.filter((item) =>
                NORMALIZED_LEGACY_CHORES.has(normalizeTitle(item.title))
              );
              if (legacyDocs.length > 0) {
                for (const docItem of legacyDocs) {
                  db.doc(`${colPath('chores')}/${docItem.id}`).delete().catch(() => {});
                }
              }
              const items = allItems
                .filter((item) => !NORMALIZED_LEGACY_CHORES.has(normalizeTitle(item.title)))
                .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
              setChores(items);

              const me = activeProfileRef.current;
              const partnerName = me === 'user1' ? householdRef.current.user2Name : householdRef.current.user1Name;
              const lastSeen = lastSeenTimestampRef.current;

              if (!initialSnapshotDoneRef.current.chores) {
                initialSnapshotDoneRef.current.chores = true;
                const addedByPartner = items.filter(
                  (c) => c.addedBy && c.addedBy !== me && (c.createdAt || 0) > lastSeen
                );
                if (addedByPartner.length > 0) {
                  const preview = addedByPartner.slice(0, 2).map((c) => c.title).join(', ');
                  const extra = addedByPartner.length > 2 ? ` (+${addedByPartner.length - 2})` : '';
                  pushStartupNotification({
                    id: `chore-partner-${addedByPartner[0].id}`,
                    icon: '📌',
                    color: 'violet',
                    title: `${partnerName} dodał(a) nowe zadanie:`,
                    body: `${preview}${extra}`,
                    tab: 'chores'
                  });
                }
                const dueItems = items.filter(isChoreDue);
                if (dueItems.length > 0) {
                  const duePreview = dueItems.slice(0, 2).map((c) => c.title).join(', ');
                  const extra = dueItems.length > 2 ? ` (+${dueItems.length - 2} więcej)` : '';
                  pushStartupNotification({
                    id: 'chores-due-startup',
                    icon: '✅',
                    color: 'emerald',
                    title: `Zadania do wykonania (${dueItems.length}):`,
                    body: `${duePreview}${extra}`,
                    tab: 'chores'
                  });
                }
              } else {
                snap.docChanges().forEach((change) => {
                  if (change.type === 'added') {
                    const data = change.doc.data();
                    if (
                      !NORMALIZED_LEGACY_CHORES.has(normalizeTitle(data.title)) &&
                      data.addedBy &&
                      data.addedBy !== me &&
                      (data.createdAt || 0) > Date.now() - 60000
                    ) {
                      pushStartupNotification({
                        id: `chore-live-${change.doc.id}`,
                        icon: '📌',
                        color: 'violet',
                        title: `${partnerName} dodał(a) zadanie:`,
                        body: `${data.title} (+${data.points || 10} pkt)`,
                        tab: 'chores'
                      });
                    }
                  }
                });
              }
            },
            (err) => console.warn('Błąd synchronizacji obowiązków:', err)
          );

        const unsubRecipes = db
          .collection(colPath('recipes'))
          .where('houseCode', '==', cleanHouseId)
          .onSnapshot(
            (snap) => {
              const items = snap.docs
                .map((d) => ({ id: d.id, ...d.data() }))
                .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
              setCustomRecipes(items);
            },
            (err) => console.warn('Błąd synchronizacji przepisów:', err)
          );

        // Zapisujemy czas ostatniej wizyty po 4 sekundach od otwarcia aplikacji, aby następnym razem pokazać tylko nowe rzeczy
        const markSeenTimer = setTimeout(() => {
          try {
            localStorage.setItem(`naszdom_last_seen_${cleanHouseId}_${activeProfileRef.current}`, String(Date.now()));
          } catch (_) {}
        }, 4000);

        // Automatyczna synchronizacja i sprawdzanie aktualizacji przy powrocie do aplikacji na iPhonie
        const handleVisibilityChange = () => {
          if (document.visibilityState === 'visible') {
            try {
              localStorage.setItem(`naszdom_last_seen_${cleanHouseId}_${activeProfileRef.current}`, String(Date.now()));
            } catch (_) {}
          }
        };
        document.addEventListener('visibilitychange', handleVisibilityChange);

        return () => {
          clearTimeout(markSeenTimer);
          document.removeEventListener('visibilitychange', handleVisibilityChange);
          initialSnapshotDoneRef.current = { shopping: false, chores: false, recipes: false };
          unsubHouse();
          unsubShopping();
          unsubFridge();
          unsubChores();
          unsubRecipes();
        };
      }, [authUser, cleanHouseId]);

      const updateHouseholdField = async (patch) => {
        householdRef.current = { ...householdRef.current, ...patch };
        setHousehold((prev) => ({ ...prev, ...patch }));
        if (!dbRef.current || !authUser) return;
        try {
          const ref = dbRef.current.doc(`${colPath('households')}/${cleanHouseId}`);
          await ref.set(patch, { mergeFields: Object.keys(patch) });
        } catch (err) {
          console.warn('Nie udało się zapisać ustawień domu:', err);
        }
      };

      const activeUserName = activeProfile === 'user1' ? household.user1Name : household.user2Name;
      const partnerUserName = activeProfile === 'user1' ? household.user2Name : household.user1Name;

      // ==========================================================================
      // OPERACJE: ZAKUPY I LODÓWKA
      // ==========================================================================
      const addShoppingItem = async (itemData) => {
        const cleanName = (itemData.name || '').trim();
        if (!cleanName) return;
        const unit = (itemData.unit || 'szt.').trim();
        const amount = parseSafeNumber(itemData.amount, 1) || 1;
        const category = itemData.category || guessShoppingCategory(cleanName);

        const existing = shoppingItems.find(
          (i) =>
            !i.checked &&
            (i.name || '').trim().toLowerCase() === cleanName.toLowerCase() &&
            (i.unit || '').trim().toLowerCase() === unit.toLowerCase()
        );

        if (existing) {
          const nextAmount = Math.round(((Number(existing.amount) || 0) + amount) * 10) / 10;
          if (dbRef.current && authUser) {
            await dbRef.current.doc(`${colPath('shopping')}/${existing.id}`).update({ amount: nextAmount });
          } else {
            setShoppingItems((prev) => prev.map((i) => (i.id === existing.id ? { ...i, amount: nextAmount } : i)));
          }
          return;
        }

        const newItem = {
          name: cleanName,
          amount,
          unit,
          category,
          checked: false,
          addedBy: activeProfile,
          houseCode: cleanHouseId,
          createdAt: Date.now()
        };

        if (dbRef.current && authUser) {
          await dbRef.current.collection(colPath('shopping')).add(newItem);
        } else {
          setShoppingItems((prev) => [{ id: `loc-${Date.now()}-${Math.random()}`, ...newItem }, ...prev]);
        }
      };

      const handleQuickAddShopping = async (e) => {
        e.preventDefault();
        if (!newItemName.trim()) return;
        await addShoppingItem({ name: newItemName, amount: newItemAmount, unit: newItemUnit });
        setNewItemName('');
        setNewItemAmount('1');
        setNewItemUnit('szt.');
      };

      const toggleShoppingItem = async (item) => {
        const nextChecked = !item.checked;
        const remainingUnchecked = shoppingItems.filter((i) => i.id !== item.id && !i.checked);

        if (nextChecked && remainingUnchecked.length === 0 && shoppingItems.length > 0) {
          try {
            let movedFoodCount = 0;
            for (const sItem of shoppingItems) {
              const cat = sItem.category || guessShoppingCategory(sItem.name);
              const loc = guessStorageLocation(sItem.name, cat);
              if (loc !== 'none') {
                await addOrMergeFridgeItem({ ...sItem, category: cat, location: loc });
                movedFoodCount++;
              }
              if (dbRef.current && authUser) {
                await dbRef.current.doc(`${colPath('shopping')}/${sItem.id}`).delete();
              }
            }
            if (!dbRef.current || !authUser) {
              setShoppingItems([]);
            }
            showToast(
              movedFoodCount > 0
                ? `Wszystko kupione! Przeniesiono ${movedFoodCount} prod. do Lodówki i Szafki 🎉`
                : 'Wszystko kupione! Lista zakupów wyczyszczona 🎉'
            );
          } catch (err) {
            console.warn('Błąd automatycznego przenoszenia zakupów:', err);
          }
          return;
        }

        if (dbRef.current && authUser) {
          await dbRef.current.doc(`${colPath('shopping')}/${item.id}`).update({ checked: nextChecked });
        } else {
          setShoppingItems((prev) => prev.map((i) => (i.id === item.id ? { ...i, checked: nextChecked } : i)));
        }
      };

      const deleteShoppingItem = async (item) => {
        if (dbRef.current && authUser) {
          await dbRef.current.doc(`${colPath('shopping')}/${item.id}`).delete();
        } else {
          setShoppingItems((prev) => prev.filter((i) => i.id !== item.id));
        }
      };

      const addOrMergeFridgeItem = async ({ name, amount, unit, category, location }) => {
        const cleanName = (name || '').trim();
        if (!cleanName) return;
        const cleanUnit = (unit || 'szt.').trim();
        const addAmt = parseSafeNumber(amount, 1) || 1;
        const resolvedCategory = category || guessShoppingCategory(cleanName);
        const resolvedLocation = location || guessStorageLocation(cleanName, resolvedCategory);
        if (resolvedLocation === 'none') return;

        const existing = fridgeItems.find(
          (f) =>
            (f.name || '').trim().toLowerCase() === cleanName.toLowerCase() &&
            (f.unit || '').trim().toLowerCase() === cleanUnit.toLowerCase() &&
            (f.location || guessStorageLocation(f.name, f.category)) === resolvedLocation
        );

        if (existing) {
          const nextAmount = Math.round(((Number(existing.amount) || 0) + addAmt) * 10) / 10;
          if (dbRef.current && authUser) {
            await dbRef.current
              .doc(`${colPath('fridge')}/${existing.id}`)
              .update({ amount: nextAmount, location: resolvedLocation, updatedAt: Date.now() });
          } else {
            setFridgeItems((prev) =>
              prev.map((f) =>
                f.id === existing.id ? { ...f, amount: nextAmount, location: resolvedLocation, updatedAt: Date.now() } : f
              )
            );
          }
          return;
        }

        const entry = {
          name: cleanName,
          amount: addAmt,
          unit: cleanUnit,
          category: resolvedCategory,
          location: resolvedLocation,
          houseCode: cleanHouseId,
          updatedAt: Date.now()
        };

        if (dbRef.current && authUser) {
          await dbRef.current.collection(colPath('fridge')).add(entry);
        } else {
          setFridgeItems((prev) => [{ id: `fr-${Date.now()}-${Math.random()}`, ...entry }, ...prev]);
        }
      };

      const moveFridgeItemLocation = async (item, targetLocation) => {
        if (dbRef.current && authUser) {
          await dbRef.current
            .doc(`${colPath('fridge')}/${item.id}`)
            .update({ location: targetLocation, updatedAt: Date.now() });
        } else {
          setFridgeItems((prev) =>
            prev.map((f) => (f.id === item.id ? { ...f, location: targetLocation, updatedAt: Date.now() } : f))
          );
        }
        showToast(targetLocation === 'fridge' ? 'Przeniesiono do Lodówki ❄️' : 'Przeniesiono do Szafki 🗄️');
      };

      const clearCheckedToFridge = async () => {
        const checked = shoppingItems.filter((i) => i.checked);
        if (checked.length === 0) return;
        try {
          let movedFoodCount = 0;
          for (const item of checked) {
            const cat = item.category || guessShoppingCategory(item.name);
            const loc = guessStorageLocation(item.name, cat);
            if (loc !== 'none') {
              await addOrMergeFridgeItem({ ...item, category: cat, location: loc });
              movedFoodCount++;
            }
            if (dbRef.current && authUser) {
              await dbRef.current.doc(`${colPath('shopping')}/${item.id}`).delete();
            }
          }
          if (!dbRef.current || !authUser) {
            setShoppingItems((prev) => prev.filter((i) => !i.checked));
          }
          showToast(`Przeniesiono ${movedFoodCount} prod. do Lodówki i Szafki (chemia pominięta) ✅`);
        } catch (err) {
          console.warn('Błąd czyszczenia koszyka:', err);
          showToast('Nie udało się wyczyścić koszyka', 'error');
        }
      };

      const updateFridgeAmount = async (item, delta) => {
        const nextAmount = Math.round(((Number(item.amount) || 0) + delta) * 10) / 10;
        if (nextAmount <= 0) {
          if (dbRef.current && authUser) {
            await dbRef.current.doc(`${colPath('fridge')}/${item.id}`).delete();
          } else {
            setFridgeItems((prev) => prev.filter((f) => f.id !== item.id));
          }
          return;
        }
        if (dbRef.current && authUser) {
          await dbRef.current
            .doc(`${colPath('fridge')}/${item.id}`)
            .update({ amount: nextAmount, updatedAt: Date.now() });
        } else {
          setFridgeItems((prev) => prev.map((f) => (f.id === item.id ? { ...f, amount: nextAmount } : f)));
        }
      };

      const handleQuickAddFridge = async (e) => {
        e.preventDefault();
        if (!newFridgeName.trim()) return;
        await addOrMergeFridgeItem({
          name: newFridgeName,
          amount: newFridgeAmount,
          unit: newFridgeUnit,
          location: newFridgeLocation
        });
        setNewFridgeName('');
        setNewFridgeAmount('1');
        setNewFridgeUnit('szt.');
        showToast(newFridgeLocation === 'fridge' ? 'Dodano do Lodówki ❄️' : 'Dodano do Szafki 🗄️');
      };

      // ==========================================================================
      // OPERACJE: OBOWIĄZKI (Z SYSTEMEM PUNKTÓW + USUWANIE I EDYCJA)
      // ==========================================================================
      const handleAddChore = async (choreData) => {
        const entry = {
          ...choreData,
          points: Math.max(1, parseInt(choreData.points, 10) || 10),
          addedBy: activeProfile,
          houseCode: cleanHouseId,
          lastDoneAt: null,
          lastDoneBy: null,
          createdAt: Date.now()
        };
        if (dbRef.current && authUser) {
          await dbRef.current.collection(colPath('chores')).add(entry);
        } else {
          setChores((prev) => [...prev, { id: `ch-${Date.now()}`, ...entry }]);
        }
        setShowAddChoreModal(false);
        showToast(`Dodano obowiązek (+${entry.points} pkt) ✅`);
      };

      const completeChore = async (chore) => {
        const now = Date.now();
        const pts = Math.max(1, parseInt(chore.points, 10) || 10);
        const ptsField = activeProfile === 'user1' ? 'user1Points' : 'user2Points';
        const nextTotal = (Number(householdRef.current[ptsField]) || 0) + pts;

        if (dbRef.current && authUser && !String(chore.id).startsWith('ch-')) {
          await dbRef.current.doc(`${colPath('chores')}/${chore.id}`).update({
            lastDoneAt: now,
            lastDoneBy: activeProfile,
            lastAwardedPoints: pts
          });
        } else {
          setChores((prev) =>
            prev.map((c) =>
              c.id === chore.id
                ? { ...c, lastDoneAt: now, lastDoneBy: activeProfile, lastAwardedPoints: pts }
                : c
            )
          );
        }
        await updateHouseholdField({ [ptsField]: nextTotal });
        showToast(`+${pts} pkt dla: ${activeUserName}! 🏆`);
      };

      const undoChore = async (chore) => {
        const awarded = Number(chore.lastAwardedPoints ?? chore.points) || 10;
        const doneBy = chore.lastDoneBy;
        if (doneBy === 'user1' || doneBy === 'user2') {
          const ptsField = doneBy === 'user1' ? 'user1Points' : 'user2Points';
          const nextTotal = Math.max(0, (Number(householdRef.current[ptsField]) || 0) - awarded);
          await updateHouseholdField({ [ptsField]: nextTotal });
        }

        if (dbRef.current && authUser && !String(chore.id).startsWith('ch-')) {
          await dbRef.current.doc(`${colPath('chores')}/${chore.id}`).update({
            lastDoneAt: null,
            lastDoneBy: null,
            lastAwardedPoints: null
          });
        } else {
          setChores((prev) =>
            prev.map((c) =>
              c.id === chore.id ? { ...c, lastDoneAt: null, lastDoneBy: null, lastAwardedPoints: null } : c
            )
          );
        }
        showToast('Cofnięto wykonanie i odjęto punkty');
      };

      const deleteChore = async (chore) => {
        const prevChores = chores;
        setChores((prev) => prev.filter((c) => c.id !== chore.id));
        try {
          if (dbRef.current && authUser && !String(chore.id).startsWith('ch-')) {
            await dbRef.current.doc(`${colPath('chores')}/${chore.id}`).delete();
          }
          showToast('Usunięto obowiązek 🗑️');
        } catch (err) {
          console.warn('Błąd usuwania obowiązku:', err);
          setChores(prevChores);
          showToast('Nie udało się usunąć obowiązku — sprawdź połączenie', 'error');
        }
      };

      const editChore = async (choreId, patch) => {
        const cleanPatch = {
          title: (patch.title || '').trim(),
          frequency: patch.frequency || 'co_tydzien',
          points: Math.max(1, parseInt(patch.points, 10) || 10)
        };
        if (!cleanPatch.title) return;
        setChores((prev) => prev.map((c) => (c.id === choreId ? { ...c, ...cleanPatch } : c)));
        try {
          if (dbRef.current && authUser && !String(choreId).startsWith('ch-')) {
            await dbRef.current.doc(`${colPath('chores')}/${choreId}`).update(cleanPatch);
          }
          showToast('Zaktualizowano obowiązek ✏️');
        } catch (err) {
          console.warn('Błąd edycji obowiązku:', err);
          showToast('Nie udało się zapisać zmian', 'error');
        }
      };

      const resetChorePoints = async () => {
        await updateHouseholdField({ user1Points: 0, user2Points: 0 });
        showToast('Wyzerowano tablicę punktów 🏆');
      };

      const sendNudge = async (chore) => {
        await updateHouseholdField({
          nudge: {
            from: activeProfile,
            fromName: activeUserName,
            choreTitle: chore.title,
            sentAt: Date.now()
          }
        });
        showToast(`Wysłano przypomnienie do: ${partnerUserName} 🔔`);
      };

      // ==========================================================================
      // OPERACJE: PRZEPISY I TINDER
      // ==========================================================================
      const saveNewRecipe = async (recipeData) => {
        const entry = {
          ...recipeData,
          votes: {},
          houseCode: cleanHouseId,
          createdAt: Date.now()
        };
        try {
          if (dbRef.current && authUser) {
            await dbRef.current.collection(colPath('recipes')).add(entry);
          } else {
            setCustomRecipes((prev) => [{ id: `rec-${Date.now()}`, ...entry }, ...prev]);
          }
          setImportModalMode(null);
          showToast(`Dodano przepis: ${recipeData.title} 🍽️`);
        } catch (err) {
          console.warn('Błąd zapisu przepisu:', err);
          showToast('Zdjęcie jest zbyt duże dla chmury — spróbuj mniejszy zrzut ekranu.', 'error');
        }
      };

      const deleteRecipe = async (recipe) => {
        if (String(recipe.id || '').startsWith('starter-')) return;
        if (dbRef.current && authUser) {
          await dbRef.current.doc(`${colPath('recipes')}/${recipe.id}`).delete();
        } else {
          setCustomRecipes((prev) => prev.filter((r) => r.id !== recipe.id));
        }
        setSelectedRecipeId(null);
        showToast('Usunięto przepis 🗑️');
      };

      const voteRecipe = async (recipe, vote) => {
        const isStarter = String(recipe.id || '').startsWith('starter-');
        if (isStarter) {
          const currentVotes = householdRef.current.starterVotes || {};
          const nextVotes = {
            ...currentVotes,
            [recipe.id]: {
              ...(currentVotes[recipe.id] || {}),
              [activeProfile]: vote
            }
          };
          await updateHouseholdField({ starterVotes: nextVotes });
        } else {
          const nextVotes = { ...(recipe.votes || {}), [activeProfile]: vote };
          if (dbRef.current && authUser) {
            await dbRef.current.doc(`${colPath('recipes')}/${recipe.id}`).update({ votes: nextVotes });
          } else {
            setCustomRecipes((prev) => prev.map((r) => (r.id === recipe.id ? { ...r, votes: nextVotes } : r)));
          }
        }
      };

      const resetAllVotes = async () => {
        try {
          await updateHouseholdField({ starterVotes: {} });
          if (dbRef.current && authUser) {
            for (const r of customRecipes) {
              await dbRef.current.doc(`${colPath('recipes')}/${r.id}`).update({ votes: {} });
            }
          } else {
            setCustomRecipes((prev) => prev.map((r) => ({ ...r, votes: {} })));
          }
          showToast('Zresetowano głosy – możecie wybierać na nowo!');
        } catch (err) {
          console.warn('Błąd resetowania głosów:', err);
          showToast('Nie udało się zresetować wszystkich głosów', 'error');
        }
      };

      const openRecipeIngredientsModal = (recipe, mult = 1) => {
        const items = (recipe.ingredients || []).map((ing, idx) => {
          const cleanName = (ing.name || '').trim();
          const unit = (ing.unit || 'szt.').trim();
          const scaled = Math.round((parseSafeNumber(ing.amount, 1) || 1) * mult * 10) / 10;
          const ingLower = cleanName.toLowerCase();

          const matchedInFridge = fridgeItems.find((fi) => {
            const fiLower = (fi.name || '').trim().toLowerCase();
            if (fiLower.length < 3 || ingLower.length < 3) return fiLower === ingLower;
            return ingLower.includes(fiLower) || fiLower.includes(ingLower);
          });

          let neededAmount = scaled;
          let coveredByFridge = false;
          if (matchedInFridge) {
            const sameUnit = (matchedInFridge.unit || '').trim().toLowerCase() === unit.toLowerCase();
            if (sameUnit) {
              const rem = Math.round((scaled - (Number(matchedInFridge.amount) || 0)) * 10) / 10;
              if (rem <= 0) coveredByFridge = true;
              else neededAmount = rem;
            } else {
              coveredByFridge = true;
            }
          }

          return {
            name: cleanName,
            unit,
            category: ing.category || guessShoppingCategory(cleanName),
            isPantry: !!ing.isPantry,
            idx,
            inFridge: matchedInFridge || null,
            scaledAmount: neededAmount,
            selected: !ing.isPantry && !coveredByFridge
          };
        });

        setAddToCartModal({
          recipeTitle: recipe.title,
          items
        });
      };

      const confirmAddIngredientsToCart = async () => {
        if (!addToCartModal) return;
        const toAdd = addToCartModal.items.filter((i) => i.selected);
        if (toAdd.length === 0) {
          setAddToCartModal(null);
          return;
        }
        for (const item of toAdd) {
          await addShoppingItem({
            name: item.name,
            amount: item.scaledAmount,
            unit: item.unit,
            category: item.category
          });
        }
        setAddToCartModal(null);
        showToast(`Dodano ${toAdd.length} składników na listę zakupów! 🛒`);
      };

      // --- PLANER POSIŁKÓW (ŚNIADANIE, OBIAD, KOLACJA • PON–ND) ---
      const mealPlan = household.mealPlan || {};
      const todayJsDay = new Date().getDay();

      const plannedMealsCount = useMemo(() => {
        let count = 0;
        for (const d of WEEK_DAYS) {
          const dayMeals = getDayMeals(mealPlan, d.id);
          for (const slot of MEAL_SLOTS) {
            if (dayMeals[slot.id]?.title) count++;
          }
        }
        return count;
      }, [mealPlan]);

      const uncookedPlannedMealsCount = useMemo(() => {
        let count = 0;
        for (const d of WEEK_DAYS) {
          const dayMeals = getDayMeals(mealPlan, d.id);
          for (const slot of MEAL_SLOTS) {
            if (dayMeals[slot.id]?.title && !dayMeals[slot.id]?.cooked) count++;
          }
        }
        return count;
      }, [mealPlan]);

      const assignMealToSlot = async (dayId, slotId, recipeOrCustom, servingsCount = null) => {
        const slotObj = MEAL_SLOTS.find((s) => s.id === slotId) || MEAL_SLOTS[1];
        const existingDay = { ...getDayMeals(householdRef.current.mealPlan, dayId) };
        const isCustom = Boolean(recipeOrCustom.isCustom);

        existingDay[slotId] = {
          recipeId: isCustom ? null : recipeOrCustom.id,
          starterId: isCustom
            ? null
            : recipeOrCustom.starterId || (String(recipeOrCustom.id || '').startsWith('starter-') ? recipeOrCustom.id : null),
          isCustom,
          title: recipeOrCustom.title,
          emoji: recipeOrCustom.emoji || slotObj.emoji,
          prepTime: recipeOrCustom.prepTime || (isCustom ? null : 25),
          servings: servingsCount || recipeOrCustom.servings || 2,
          cooked: false,
          plannedBy: activeProfile,
          plannedAt: Date.now()
        };

        const nextPlan = {
          ...(householdRef.current.mealPlan || {}),
          [dayId]: existingDay
        };
        await updateHouseholdField({ mealPlan: nextPlan });
        const dayObj = WEEK_DAYS.find((d) => d.id === dayId);
        showToast(`Zaplanowano (${slotObj.label}, ${dayObj?.short || dayId}): ${recipeOrCustom.title} 📅`);
      };

      const updateMealPlanSlot = async (dayId, slotId, patch) => {
        const existingDay = { ...getDayMeals(householdRef.current.mealPlan, dayId) };
        if (!existingDay[slotId]) return;
        existingDay[slotId] = { ...existingDay[slotId], ...patch };
        const nextPlan = {
          ...(householdRef.current.mealPlan || {}),
          [dayId]: existingDay
        };
        await updateHouseholdField({ mealPlan: nextPlan });
      };

      const removeMealPlanSlot = async (dayId, slotId) => {
        const existingDay = { ...getDayMeals(householdRef.current.mealPlan, dayId) };
        delete existingDay[slotId];
        const nextPlan = { ...(householdRef.current.mealPlan || {}) };
        const hasAny = MEAL_SLOTS.some((s) => existingDay[s.id]?.title);
        if (hasAny) {
          nextPlan[dayId] = existingDay;
        } else {
          delete nextPlan[dayId];
        }
        await updateHouseholdField({ mealPlan: nextPlan });
        showToast('Usunięto posiłek z planu');
      };

      const clearMealPlan = async () => {
        await updateHouseholdField({ mealPlan: {} });
        setConfirmClearPlan(false);
        showToast('Wyczyszczono cały plan posiłków na ten tydzień 🧹');
      };

      const randomizeMissingLunches = async () => {
        if (recipes.length === 0) return;
        const currentPlan = { ...(householdRef.current.mealPlan || {}) };
        const usedIds = new Set();
        const emptyDays = [];

        for (const day of WEEK_DAYS) {
          const dayMeals = getDayMeals(currentPlan, day.id);
          if (dayMeals.lunch?.recipeId) usedIds.add(dayMeals.lunch.recipeId);
          if (!dayMeals.lunch?.title) emptyDays.push(day);
        }

        if (emptyDays.length === 0) {
          showToast('Wszystkie obiady w tygodniu są już zaplanowane! 📅', 'info');
          return;
        }

        const lunchCandidates = recipes.filter((r) => !(r.tags || []).includes('sniadanie'));
        const poolBase = lunchCandidates.length > 0 ? lunchCandidates : recipes;

        const matchPool = poolBase.filter(
          (r) => r.votes?.user1 === 'yes' && r.votes?.user2 === 'yes' && !usedIds.has(r.id)
        );
        const otherPool = poolBase.filter(
          (r) => !usedIds.has(r.id) && !matchPool.some((m) => m.id === r.id)
        );
        const shuffled = [
          ...matchPool.sort(() => Math.random() - 0.5),
          ...otherPool.sort(() => Math.random() - 0.5)
        ];

        let idx = 0;
        for (const day of emptyDays) {
          const pick = shuffled[idx] || poolBase[Math.floor(Math.random() * poolBase.length)];
          idx++;
          const existingDay = { ...getDayMeals(currentPlan, day.id) };
          existingDay.lunch = {
            recipeId: pick.id,
            starterId: pick.starterId || (String(pick.id || '').startsWith('starter-') ? pick.id : null),
            isCustom: false,
            title: pick.title,
            emoji: pick.emoji || '🍽️',
            prepTime: pick.prepTime || 25,
            servings: pick.servings || 2,
            cooked: false,
            plannedBy: activeProfile,
            plannedAt: Date.now()
          };
          currentPlan[day.id] = existingDay;
        }
        await updateHouseholdField({ mealPlan: currentPlan });
        showToast(`Wylosowano obiady na ${emptyDays.length} wolnych dni! 🎲`);
      };

      const openWeeklyPlanShoppingModal = () => {
        const activeEntries = [];
        for (const day of WEEK_DAYS) {
          const dayMeals = getDayMeals(mealPlan, day.id);
          for (const slot of MEAL_SLOTS) {
            const entry = dayMeals[slot.id];
            if (entry?.title && !entry.cooked) {
              activeEntries.push({ day, slot, entry });
            }
          }
        }

        if (activeEntries.length === 0) {
          showToast('Najpierw zaplanuj przynajmniej jeden nieprzygotowany posiłek 📅', 'info');
          return;
        }

        const mergedMap = new Map();
        let matchedRecipeCount = 0;

        for (const { day, slot, entry } of activeEntries) {
          if (!entry.recipeId && !entry.starterId) continue;
          const recipe = recipes.find(
            (r) =>
              r.id === entry.recipeId ||
              (entry.starterId && (r.id === entry.starterId || r.starterId === entry.starterId))
          );
          if (!recipe) continue;
          matchedRecipeCount++;

          const baseServings = Number(recipe.servings) || 2;
          const plannedServings = Number(entry.servings) || baseServings;
          const mult = plannedServings / baseServings;
          const dayTag = `${day.short} (${slot.short})`;

          for (const ing of recipe.ingredients || []) {
            const cleanName = (ing.name || '').trim();
            if (!cleanName) continue;
            const unit = (ing.unit || 'szt.').trim();
            const key = `${cleanName.toLowerCase()}__${unit.toLowerCase()}`;
            const scaled = (parseSafeNumber(ing.amount, 1) || 1) * mult;

            if (mergedMap.has(key)) {
              const existing = mergedMap.get(key);
              existing.scaledAmount = Math.round((existing.scaledAmount + scaled) * 10) / 10;
              if (!existing.days.includes(dayTag)) existing.days.push(dayTag);
              if (!ing.isPantry) existing.isPantry = false;
            } else {
              mergedMap.set(key, {
                name: cleanName,
                unit,
                category: ing.category || guessShoppingCategory(cleanName),
                isPantry: !!ing.isPantry,
                scaledAmount: Math.round(scaled * 10) / 10,
                days: [dayTag]
              });
            }
          }
        }

        if (mergedMap.size === 0) {
          showToast('Zaplanowane pozycje nie mają przypisanych przepisów ze składnikami.', 'info');
          return;
        }

        const aggregatedItems = Array.from(mergedMap.values()).map((ing, idx) => {
          const ingLower = ing.name.toLowerCase();
          const matchedInFridge = fridgeItems.find((fi) => {
            const fiLower = (fi.name || '').trim().toLowerCase();
            if (fiLower.length < 3 || ingLower.length < 3) return fiLower === ingLower;
            return ingLower.includes(fiLower) || fiLower.includes(ingLower);
          });

          let neededAmount = ing.scaledAmount;
          let coveredByFridge = false;
          if (matchedInFridge) {
            const sameUnit = (matchedInFridge.unit || '').trim().toLowerCase() === ing.unit.toLowerCase();
            if (sameUnit) {
              const rem = Math.round((ing.scaledAmount - (Number(matchedInFridge.amount) || 0)) * 10) / 10;
              if (rem <= 0) coveredByFridge = true;
              else neededAmount = rem;
            } else {
              coveredByFridge = true;
            }
          }

          return {
            ...ing,
            idx,
            inFridge: matchedInFridge || null,
            scaledAmount: neededAmount,
            selected: !ing.isPantry && !coveredByFridge
          };
        });

        setAddToCartModal({
          recipeTitle: `Plan tygodnia (${formatMealCount(matchedRecipeCount)})`,
          items: aggregatedItems
        });
      };

      // ==========================================================================
      // DANE POCHODNE DO RENDEROWANIA
      // ==========================================================================
      const uncheckedShopping = shoppingItems.filter((i) => !i.checked);
      const checkedShopping = shoppingItems.filter((i) => i.checked);

      const fridgeOnlyItems = useMemo(
        () => fridgeItems.filter((f) => (f.location || guessStorageLocation(f.name, f.category)) === 'fridge'),
        [fridgeItems]
      );
      const pantryOnlyItems = useMemo(
        () => fridgeItems.filter((f) => (f.location || guessStorageLocation(f.name, f.category)) === 'pantry'),
        [fridgeItems]
      );

      const groupedShopping = useMemo(() => {
        const groups = {};
        for (const item of uncheckedShopping) {
          const cat = guessShoppingCategory(item.name);
          if (!groups[cat]) groups[cat] = [];
          groups[cat].push(item);
        }
        return SHOPPING_CATEGORIES.filter((c) => groups[c.id]?.length > 0).map((c) => ({
          ...c,
          items: groups[c.id]
        }));
      }, [uncheckedShopping]);

      const matchCount = useMemo(
        () => recipes.filter((r) => r.votes?.user1 === 'yes' && r.votes?.user2 === 'yes').length,
        [recipes]
      );

      const filteredRecipes = useMemo(() => {
        const q = recipeSearch.trim().toLowerCase();
        return recipes.filter((r) => {
          if (selectedTag === 'matches') {
            if (!(r.votes?.user1 === 'yes' && r.votes?.user2 === 'yes')) return false;
          } else if (selectedTag !== 'all') {
            if (!(r.tags || []).includes(selectedTag)) return false;
          }
          if (!q) return true;
          return (
            (r.title || '').toLowerCase().includes(q) ||
            (r.ingredients || []).some((i) => (i.name || '').toLowerCase().includes(q))
          );
        });
      }, [recipes, recipeSearch, selectedTag]);

      const visibleChores = useMemo(
        () => (choresFilter === 'due' ? chores.filter(isChoreDue) : chores),
        [chores, choresFilter]
      );

      // ==========================================================================
      // RENDER
      // ==========================================================================
      return (
        <div className="min-h-screen bg-slate-50 text-slate-900 pb-nav">
          {/* GÓRNY PASEK */}
          <header className="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200/80 safe-top">
            <div className="max-w-xl mx-auto px-4 pb-3 flex items-center justify-between gap-2">
              <div className="flex items-center gap-2.5 min-w-0">
                <div className="w-9 h-9 rounded-2xl bg-indigo-600 text-white flex items-center justify-center text-lg shadow-sm shrink-0">
                  🏡
                </div>
                <div className="min-w-0">
                  <h1 className="text-base font-extrabold tracking-tight text-slate-900 leading-tight truncate">
                    Nasz Dom
                  </h1>
                  <button
                    onClick={() => setShowSettingsModal(true)}
                    className="flex items-center gap-1 text-[11px] font-semibold text-slate-500"
                  >
                    <span
                      className={`w-2 h-2 rounded-full ${
                        syncStatus === 'synced'
                          ? 'bg-emerald-500'
                          : syncStatus === 'error'
                          ? 'bg-rose-500'
                          : syncStatus === 'connecting'
                          ? 'bg-amber-400 animate-pulse'
                          : 'bg-slate-300'
                      }`}
                    />
                    {syncStatus === 'synced'
                      ? 'Chmura aktywna'
                      : syncStatus === 'connecting'
                      ? 'Łączenie...'
                      : syncStatus === 'error'
                      ? 'Błąd chmury'
                      : 'Tryb lokalny (podepnij chmurę)'}
                  </button>
                </div>
              </div>

              <div className="flex items-center gap-1.5 shrink-0">
                <button
                  onClick={() => setActiveProfile((p) => (p === 'user1' ? 'user2' : 'user1'))}
                  className="px-3 py-1.5 rounded-2xl bg-indigo-50 border border-indigo-200/80 text-indigo-700 text-xs font-bold flex items-center gap-1.5 active:scale-95 transition-transform"
                  title="Zmień aktywny profil"
                >
                  <span>{activeProfile === 'user1' ? '🙋‍♂️' : '🙋‍♀️'}</span>
                  <span className="max-w-[72px] truncate">{activeUserName}</span>
                </button>
                <button
                  onClick={() => setShowSettingsModal(true)}
                  className="p-2 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-600 active:scale-95 transition-transform"
                  aria-label="Ustawienia"
                >
                  <Icon name="settings" className="w-4 h-4" />
                </button>
              </div>
            </div>
          </header>

          {/* GŁÓWNA TREŚĆ */}
